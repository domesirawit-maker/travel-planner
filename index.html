}

/* ── Timeline Item ── */
function TimelineItem({item,onEdit,onDelete,onReorder,onShowImage,onUpdatePhoto,onToggleDone}){
  const [isDragOver,setIsDragOver]=useState(false);
  const dragRef=useRef(null);
  const photoRef=useRef(null);

  const hDS=e=>{ e.dataTransfer.setData('itemId',item.id); e.dataTransfer.effectAllowed='move'; setTimeout(()=>dragRef.current?.classList.add('dragging'),0); };
  const hDE=()=>{ dragRef.current?.classList.remove('dragging'); setIsDragOver(false); };
  const hDO=e=>{ if(!e.dataTransfer.types.includes('itemid')) return; e.preventDefault(); e.dataTransfer.dropEffect='move'; setIsDragOver(true); };
  const hDL=()=>setIsDragOver(false);
  const hDP=e=>{ e.preventDefault(); setIsDragOver(false); const f=e.dataTransfer.getData('itemId'); if(f&&f!==item.id) onReorder(f); };

  const handlePhoto=async e=>{ const f=e.target.files[0]; if(!f) return; try{ const d=await fileToDataURL(f,800); onUpdatePhoto(d); }catch(err){console.warn(err);} e.target.value=''; };

  return(
    <div ref={dragRef} className={`tl-item${isDragOver?' drag-over':''}${item.done?' ti-done':''}`} onDragOver={hDO} onDragLeave={hDL} onDrop={hDP}>
      {/* Checkbox */}
      <div className="ti-check" onClick={()=>onToggleDone&&onToggleDone()} title={item.done?'Mark as todo':'Mark as done'}>
        {item.done&&<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,6 5,9 10,3"/></svg>}
      </div>
      {/* Drag handle */}
      <div className="drag-handle" draggable style={{alignSelf:'center'}} onDragStart={hDS} onDragEnd={hDE} title="Drag to reorder">
        <Icon name="grip"/>
      </div>
      {/* Time */}
      <div className="ti-time">
        {formatTime24(item.time)}
        {item.duration&&<span className="ti-dur">{item.duration}</span>}
      </div>

      {/* Body — photo floats right inside, text wraps cleanly beside it */}
      <div className="ti-body">
        {/* Photo: float right — MUST be first child for float to work */}
        {item.image&&(
          <div className="ti-photo" style={{backgroundImage:`url(${item.image})`}}
            onClick={()=>onShowImage&&onShowImage(item.image)} title="Click to enlarge"/>
        )}
        <div className="ti-title">{item.title||'(untitled)'}</div>
        {item.location&&(
          <div className="ti-place">
            <Icon name="pin"/>
            <span>{item.location}</span>
          </div>
        )}
        {item.notes&&<div className="ti-notes">{item.notes}</div>}
        {/* action bar — always below all text, clears the float */}
        <div className="ti-action-bar">
          {item.location&&<MapPicker placeOrItem={item} label="Map"/>}
          <button className="icon-btn" onClick={onEdit} title="Edit" style={{width:30,height:30}}><Icon name="edit" style={{width:13,height:13}}/></button>
          <button className="icon-btn" onClick={onDelete} title="Delete" style={{width:30,height:30,color:'var(--danger)'}}><Icon name="trash" style={{width:13,height:13}}/></button>
          {!item.image&&(
            <label className="photo-upload" title="Add photo" style={{marginTop:0}}>
              <Icon name="camera"/><span>Add photo</span>
              <input ref={photoRef} type="file" accept="image/*" onChange={handlePhoto}/>
            </label>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Activity Edit Sheet (full-screen) ── */
function ActivityEditSheet({item,onSave,onCancel,isNew}){
  const [draft,setDraft]=useState({image:'',...item});
  const [touched,setTouched]=useState(false);

  const update=(k,v)=>{ setDraft(p=>({...p,[k]:v})); setTouched(true); };
  const canSave=draft.title?.trim().length>0;

  const handlePhoto=async e=>{ const f=e.target.files[0]; if(!f) return; try{const d=await fileToDataURL(f,800);update('image',d);}catch(err){console.warn(err);} e.target.value=''; };

  return(
    <div className="edit-sheet">
      <div className="edit-sheet-head">
        <button className="back-btn" onClick={onCancel}><Icon name="x"/></button>
        <div className="edit-sheet-title">{isNew?'New activity':'Edit activity'}</div>
        {touched&&<span style={{fontSize:11,color:'var(--muted)',fontStyle:'italic'}}>unsaved</span>}
      </div>
      <div className="edit-sheet-body">
        <div className="row2">
          <div className="field"><label>Time</label><input type="time" className="input" value={draft.time||''} step="60" onChange={e=>update('time',e.target.value)}/></div>
          <div className="field"><label>Duration</label><input className="input" placeholder="e.g. 2h" value={draft.duration||''} onChange={e=>update('duration',e.target.value)}/></div>
        </div>
        <div className="field"><label>Title *</label><input className="input" placeholder="e.g. Visit temple" value={draft.title||''} autoFocus onChange={e=>update('title',e.target.value)}/></div>
        <div className="field"><label>Location</label><input className="input" placeholder="Place or area" value={draft.location||''} onChange={e=>update('location',e.target.value)}/></div>
        <div className="field"><label>Notes</label><textarea className="textarea" rows="3" placeholder="Tips, reservations…" value={draft.notes||''} onChange={e=>update('notes',e.target.value)}/></div>
        <div className="field">
          <label>Photo</label>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            {draft.image&&<div style={{width:56,height:56,borderRadius:9,backgroundImage:`url(${draft.image})`,backgroundSize:'cover',backgroundPosition:'center',border:'1px solid var(--line)',flexShrink:0}}/>}
            <div style={{display:'flex',flexDirection:'column',gap:6}}>
              <label className="btn sm" style={{cursor:'pointer'}}><Icon name="camera" style={{width:14,height:14}}/> {draft.image?'Change':'Add photo'}<input type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto}/></label>
              {draft.image&&<button className="btn ghost sm" onClick={()=>update('image','')}><Icon name="x" style={{width:11,height:11}}/> Remove</button>}
            </div>
          </div>
        </div>
      </div>
      <div className="edit-sheet-foot">
        <button className="btn ghost" style={{flex:1}} onClick={onCancel}>Discard</button>
        <button className="btn accent" style={{flex:2,opacity:canSave?1:.5,fontWeight:700,fontSize:15}} onClick={()=>canSave&&onSave(draft)} disabled={!canSave}>
          <Icon name="check" style={{width:16,height:16}}/> {isNew?'Add activity':'Save changes'}
        </button>
      </div>
    </div>
  );
}

/* ── Add Day Inline ── */
function AddDayInline({tripStart,tripEnd,existing,onAdd}){
  const suggestNext=()=>{ if(!tripStart) return ''; const sorted=[...existing].filter(Boolean).sort(); const last=sorted[sorted.length-1]; const base=last?new Date(last):new Date(tripStart); if(last) base.setDate(base.getDate()+1); return base.toISOString().slice(0,10); };
  const [date,setDate]=useState('');
  useEffect(()=>{ setDate(suggestNext()); },[tripStart,existing.length]);
  return(
    <div style={{display:'flex',gap:8,alignItems:'center',width:'100%'}}>
      <input type="date" className="input" style={{flex:1}} value={date} min={tripStart||undefined} max={tripEnd||undefined} onChange={e=>setDate(e.target.value)}/>
      <button className="btn" onClick={()=>{if(date) onAdd(date);}}><Icon name="plus" style={{width:14,height:14}}/> Add day</button>
    </div>
  );
}

/* ── Places Tab ── */
function PlacesTab({trip,onAddPlace,onUpdatePlace,onDeletePlace,onShowImage}){
  const [filter,setFilter]=useState('all');
  const [cityFilter,setCityFilter]=useState('all');
  const [addOpen,setAddOpen]=useState(false);

  const cities=useMemo(()=>{ const s=new Set(); trip.places.forEach(p=>{if(p.city)s.add(p.city);}); return Array.from(s).sort(); },[trip.places]);
  const counts=useMemo(()=>{ const c={all:0}; const base=cityFilter==='all'?trip.places:trip.places.filter(p=>(p.city||'')===cityFilter); base.forEach(p=>{ c.all=(c.all||0)+1; c[p.kind]=(c[p.kind]||0)+1; }); return c; },[trip.places,cityFilter]);
  const visible=trip.places.filter(p=>(filter==='all'||p.kind===filter)&&(cityFilter==='all'||(p.city||'')===cityFilter));

  return(
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}}>
      {/* Category filters */}
      <div className="filter-row">
        {[{id:'all',label:'All',icon:null},...Object.entries(KIND_META).map(([k,m])=>({id:k,label:m.label,icon:m.icon}))].map(t=>(
          <button key={t.id} className={`filter-pill${filter===t.id?' active':''}`} onClick={()=>setFilter(t.id)}>
            {t.icon&&<Icon name={t.icon}/>}{t.label}
            <span className="filter-count">{counts[t.id]||0}</span>
          </button>
        ))}
      </div>
      {/* City filters */}
      {cities.length>1&&(
        <div className="filter-row" style={{paddingTop:4}}>
          {['all',...cities].map(c=>(
            <button key={c} className={`filter-pill${cityFilter===c?' active':''}`} onClick={()=>setCityFilter(c)} style={{fontSize:11.5}}>
              {c==='all'?'All cities':c}
            </button>
          ))}
        </div>
      )}

      <div>
        {visible.length===0&&(
          <div style={{padding:'32px 16px',textAlign:'center',color:'var(--muted)',fontSize:13}}>
            {filter==='all'?'No places saved yet. Add a food spot, attraction, or stay below ↓':`No ${KIND_META[filter]?.plural?.toLowerCase()||'places'} yet.`}
          </div>
        )}
        {visible.map(p=>(
          <PlaceCard key={p.id} place={p}
            onSave={patch=>onUpdatePlace(p.id,patch)}
            onDelete={()=>onDeletePlace(p.id)}
            onShowImage={onShowImage}/>
        ))}
        {/* Add place */}
        {addOpen?(
          <div style={{margin:'0 14px 14px'}}>
            <AddPlaceForm onAdd={p=>{onAddPlace(p);setAddOpen(false);}} onCancel={()=>setAddOpen(false)}/>
          </div>
        ):(
          <button className="btn full" style={{margin:'4px 14px',width:'calc(100% - 28px)'}} onClick={()=>setAddOpen(true)}>
            <Icon name="plus" style={{width:14,height:14}}/> Add a place
          </button>
        )}
      </div>
    </div>
  );
}

          </button>
          <button className="btn" onClick={()=>{setDraft(place);setEditing(false);}}>Cancel</button>
        </div>
      </div>
    );
  }

  const meta=KIND_META[place.kind]||KIND_META.other;
  return(
    <div className={`place-card ${place.kind||'other'}`}>
      <div className="place-badge"><Icon name={meta.icon} style={{width:18,height:18}}/></div>
      <div className="place-body">
        <div className="place-name">{place.name||'Untitled place'}</div>
        {place.city&&<span className="place-city" style={{marginBottom:4,display:'inline-block'}}>{place.city}</span>}
        {place.address&&<div className="place-addr"><Icon name="pin"/>{place.address}</div>}
        {place.notes&&<div className="place-note">{place.notes}</div>}
        <div className="place-footer">
          <MapPicker placeOrItem={place}/>
          <button className="btn sm" onClick={()=>setEditing(true)}><Icon name="edit" style={{width:13,height:13}}/></button>
          {confirmDel?(
            <span className="inline-confirm">
              <button className="btn sm danger" onClick={onDelete}>Delete</button>
              <button className="btn ghost sm" onClick={()=>setConfirmDel(false)}>Cancel</button>
            </span>
          ):(
            <button className="btn sm" style={{color:'var(--danger)'}} onClick={()=>setConfirmDel(true)}><Icon name="trash" style={{width:13,height:13}}/></button>
          )}
        </div>
      </div>
      {place.image&&(
        <div className="place-thumb" style={{backgroundImage:`url(${place.image})`}} onClick={()=>onShowImage&&onShowImage(place.image)}/>
      )}
    </div>
  );
}

/* ── Add Place Form ── */
function AddPlaceForm({onAdd,onCancel}){
  const [name,setName]=useState('');
  const [city,setCity]=useState('');
  const [address,setAddress]=useState('');
  const [kind,setKind]=useState('food');
  const [notes,setNotes]=useState('');
  const [image,setImage]=useState('');
  const nameRef=useRef(null);
  const fileRef=useRef(null);
  useEffect(()=>{ nameRef.current?.focus(); },[]);

  const submit=e=>{ e?.preventDefault(); if(!name.trim()) return; onAdd({name:name.trim(),city:city.trim(),address:address.trim(),kind,notes,image}); };

  const handlePhoto=async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=await fileToDataURL(f,900); setImage(d); }
    catch(err){ console.warn(err); }
    e.target.value='';
  };

  return(
    <div className="add-place-sheet">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <strong style={{fontSize:15,fontFamily:"'Fraunces',serif"}}>Add place</strong>
        <button className="icon-btn" onClick={onCancel}><Icon name="x" style={{width:15,height:15}}/></button>
      </div>
      <div className="field"><label>Name *</label><input ref={nameRef} className="input" placeholder="Wong Tai Sin Temple" value={name} onChange={e=>setName(e.target.value)}/></div>
      <div className="row2">
        <div className="field"><label>City</label><input className="input" placeholder="Hong Kong" value={city} onChange={e=>setCity(e.target.value)}/></div>
        <div className="field"><label>Category</label>
          <select className="select" value={kind} onChange={e=>setKind(e.target.value)}>
            {Object.entries(KIND_META).map(([k,m])=><option key={k} value={k}>{m.label}</option>)}
          </select>
        </div>
      </div>
      <div className="field"><label>Address</label><input className="input" placeholder="Street, district" value={address} onChange={e=>setAddress(e.target.value)}/></div>
      <div className="field"><label>Notes</label><textarea className="textarea" rows="2" placeholder="Tips, hours, price…" value={notes} onChange={e=>setNotes(e.target.value)}/></div>

      {/* Photo upload row */}
      <div className="field">
        <label>Photo <span style={{fontWeight:400,textTransform:'none',letterSpacing:0,color:'var(--muted)'}}>optional</span></label>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          {/* Preview */}
          <div style={{
            width:64,height:64,borderRadius:10,flexShrink:0,
            background:image?'none':'var(--bg2)',
            backgroundImage:image?`url(${image})`:'none',
            backgroundSize:'cover',backgroundPosition:'center',
            border:'1.5px dashed var(--lines)',
            display:'grid',placeItems:'center',color:'var(--muted)',overflow:'hidden',
          }}>
            {!image&&<Icon name="image" style={{width:22,height:22,opacity:.4}}/>}
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:6}}>
            <label className="btn sm" style={{cursor:'pointer',display:'inline-flex',alignItems:'center',gap:6}}>
              <Icon name="camera" style={{width:13,height:13}}/>
              {image?'Change photo':'Add photo'}
              <input ref={fileRef} type="file" accept="image/*" style={{display:'none'}} onChange={handlePhoto}/>
            </label>
            {image&&(
              <button className="btn ghost sm" style={{fontSize:12,padding:'5px 10px'}} onClick={()=>setImage('')}>
                <Icon name="x" style={{width:11,height:11}}/> Remove
              </button>
            )}
          </div>
        </div>
      </div>

      <div style={{display:'flex',gap:8,justifyContent:'flex-end',marginTop:4}}>
        <button className="btn ghost" onClick={onCancel}>Cancel</button>
        <button className="btn primary" disabled={!name.trim()} onClick={submit}><Icon name="plus" style={{width:14,height:14}}/> Add place</button>
      </div>
    </div>
  );
}

/* ── Info Tab ── */
function InfoTab({trip,onUpdate,onDelete,onPrint}){
  const [editing,setEditing]=useState(false);
  const [confirmDel,setConfirmDel]=useState(false);
  const [form,setForm]=useState({title:trip.title||'',origin:trip.origin||'',destination:trip.destination||'',startDate:trip.startDate||'',endDate:trip.endDate||'',travelers:trip.travelers||1,budget:trip.budget||'',currency:trip.currency||'HKD',notes:trip.notes||''});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const save=()=>{ onUpdate(form); setEditing(false); };

  const dur=tripDuration(trip.startDate,trip.endDate);

  if(editing){
    return(
      <div style={{flex:1}}>
        <div style={{padding:'18px 16px',display:'flex',flexDirection:'column',gap:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontFamily:"'Fraunces',serif",fontSize:18,fontWeight:700}}>Edit trip</span>
            <button className="icon-btn" onClick={()=>setEditing(false)}><Icon name="x" style={{width:15,height:15}}/></button>
          </div>
          <div className="field"><label>Title</label><input className="input" value={form.title} onChange={e=>set('title',e.target.value)}/></div>
          <div className="row2">
            <div className="field"><label>From</label><input className="input" value={form.origin} placeholder="City, Country" onChange={e=>set('origin',e.target.value)}/></div>
            <div className="field"><label>Destination</label><input className="input" value={form.destination} placeholder="City, Country" onChange={e=>set('destination',e.target.value)}/></div>
          </div>
          <div className="row2">
            <div className="field"><label>Start date</label><input type="date" className="input" value={form.startDate} onChange={e=>set('startDate',e.target.value)}/></div>
            <div className="field"><label>End date</label><input type="date" className="input" value={form.endDate} onChange={e=>set('endDate',e.target.value)}/></div>
          </div>
          <div className="row2">
            <div className="field"><label>Travelers</label><input type="number" min="1" className="input" value={form.travelers} onChange={e=>set('travelers',Math.max(1,Number(e.target.value)||1))}/></div>
            <div className="field"><label>Budget</label><input type="number" min="0" className="input" value={form.budget} placeholder="0" onChange={e=>set('budget',e.target.value)}/></div>
          </div>
          <div className="field"><label>Currency</label>
            <select className="select" value={form.currency} onChange={e=>set('currency',e.target.value)}>
              {['HKD','THB','CNY','USD','EUR','JPY','SGD','GBP'].map(c=><option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div className="field"><label>Notes</label><textarea className="textarea" rows="4" value={form.notes} placeholder="Visa requirements, packing list…" onChange={e=>set('notes',e.target.value)}/></div>
          <div style={{display:'flex',gap:8,marginTop:4}}>
            <button className="btn ghost" style={{flex:1}} onClick={()=>setEditing(false)}>Cancel</button>
            <button className="btn accent full" style={{flex:2}} onClick={save}><Icon name="check" style={{width:14,height:14}}/> Save changes</button>
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="scroll-view">
      <div style={{padding:'18px 16px',display:'flex',flexDirection:'column',gap:0}}>
        {/* Info rows */}
        {[
          {icon:'route',label:'Departure',val:trip.origin||'—'},
          {icon:'pin',label:'Destination',val:trip.destination||'—'},
          {icon:'calendar',label:'Dates',val:fmtDateRange(trip.startDate,trip.endDate)+(dur?` · ${dur} days`:'')},
          {icon:'users',label:'Travelers',val:`${trip.travelers||1} traveler${(trip.travelers||1)>1?'s':''}`},
          {icon:'wallet',label:'Budget',val:trip.budget?`${trip.currency} ${Number(trip.budget).toLocaleString()}`:'Not set'},
        ].map(r=>(
          <div key={r.label} className="trip-info-row">
            <div className="trip-info-ico"><Icon name={r.icon}/></div>
            <div style={{flex:1,minWidth:0}}>
              <div className="trip-info-label">{r.label}</div>
              <div className="trip-info-val">{r.val}</div>
            </div>
          </div>
        ))}
        {trip.notes&&(
          <div style={{padding:'14px 0',borderTop:'1px solid var(--line)'}}>
            <div style={{fontSize:11,textTransform:'uppercase',letterSpacing:'.1em',color:'var(--muted)',fontWeight:600,marginBottom:8}}>Notes</div>
            <div style={{fontSize:13,color:'var(--ink2)',lineHeight:1.55,whiteSpace:'pre-wrap'}}>{trip.notes}</div>
          </div>
        )}
      </div>

      {/* Actions */}
      <div style={{padding:'0 16px 24px',display:'flex',flexDirection:'column',gap:10}}>
        <button className="btn full" onClick={()=>setEditing(true)}><Icon name="edit" style={{width:15,height:15}}/> Edit trip details</button>
        <button className="btn full" onClick={onPrint}><Icon name="pdf" style={{width:15,height:15}}/> Save as PDF</button>
        {confirmDel?(
          <div style={{display:'flex',gap:8}}>
            <button className="btn ghost" style={{flex:1}} onClick={()=>setConfirmDel(false)}>Cancel</button>
            <button className="btn danger" style={{flex:2}} onClick={onDelete}><Icon name="trash" style={{width:14,height:14}}/> Yes, delete trip</button>
          </div>
        ):(
          <button className="btn full danger" onClick={()=>setConfirmDel(true)}><Icon name="trash" style={{width:15,height:15}}/> Delete this trip</button>
        )}
      </div>
    </div>
  );
}

/* ── New Trip Modal (bottom sheet) ── */
function NewTripModal({onClose,onCreate}){
  const [data,setData]=useState({title:'',destination:'',origin:'',startDate:'',endDate:'',travelers:1});
  const inputRef=useRef(null);
  useEffect(()=>{ inputRef.current?.focus(); },[]);
  useEffect(()=>{ const k=e=>{ if(e.key==='Escape') onClose(); }; window.addEventListener('keydown',k); return()=>window.removeEventListener('keydown',k); },[onClose]);
  const valid=data.title.trim().length>0;

  return(
    <div className="modal-backdrop" onMouseDown={e=>{if(e.target===e.currentTarget) onClose();}}>
      <div className="modal">
        <div className="modal-handle"/>
        <div className="modal-head">
          <h3>New trip</h3>
          <button className="icon-btn" onClick={onClose}><Icon name="x" style={{width:15,height:15}}/></button>
        </div>
        <div className="modal-body">
          <div className="field"><label>Trip title *</label><input ref={inputRef} className="input" placeholder="e.g. Hong Kong & Shenzhen" value={data.title} onChange={e=>setData({...data,title:e.target.value})} onKeyDown={e=>{if(e.key==='Enter'&&valid) onCreate(data);}}/></div>
          <div className="row2">
            <div className="field"><label>From</label><input className="input" placeholder="Bangkok" value={data.origin} onChange={e=>setData({...data,origin:e.target.value})}/></div>
            <div className="field"><label>To</label><input className="input" placeholder="Hong Kong" value={data.destination} onChange={e=>setData({...data,destination:e.target.value})}/></div>
          </div>
          <div className="row2">
            <div className="field"><label>Start</label><input type="date" className="input" value={data.startDate} onChange={e=>setData({...data,startDate:e.target.value})}/></div>
            <div className="field"><label>End</label><input type="date" className="input" value={data.endDate} onChange={e=>setData({...data,endDate:e.target.value})}/></div>
          </div>
          <div className="field"><label>Travelers</label><input type="number" min="1" className="input" value={data.travelers} onChange={e=>setData({...data,travelers:Math.max(1,Number(e.target.value)||1)})}/></div>
        </div>
        <div className="modal-foot">
          <button className="btn ghost" style={{flex:1}} onClick={onClose}>Cancel</button>
          <button className="btn accent" style={{flex:2}} disabled={!valid} onClick={()=>onCreate(data)}><Icon name="check" style={{width:14,height:14}}/> Create trip</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
