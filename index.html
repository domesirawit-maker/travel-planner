<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Travel Plan · HK · Shenzhen · Guangzhou</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f6f1e8;
    --bg-2: #efe7d8;
    --paper: #fbf7ef;
    --ink: #1f1b16;
    --ink-2: #4a4239;
    --muted: #8a7f70;
    --line: #e3d9c6;
    --line-strong: #c9bda4;
    --accent: oklch(62% 0.14 45);
    --accent-ink: oklch(38% 0.10 45);
    --accent-bg: oklch(95% 0.03 75);
    --leaf: oklch(55% 0.10 150);
    --leaf-bg: oklch(94% 0.04 150);
    --sky: oklch(55% 0.12 240);
    --sky-bg: oklch(94% 0.04 240);
    --danger: oklch(55% 0.18 25);
    --shadow: 0 1px 0 rgba(31,27,22,0.04), 0 8px 24px -12px rgba(31,27,22,0.18);
    --radius: 14px;
    --transition-theme: background .2s ease, color .2s ease, border-color .2s ease;
  }

  /* ── Dark mode ───────────────────────────────────────────── */
  [data-theme="dark"] {
    --bg: #1a1510;
    --bg-2: #231e17;
    --paper: #201b14;
    --ink: #f0e8d8;
    --ink-2: #c4b8a4;
    --muted: #7a7060;
    --line: #332c22;
    --line-strong: #4a4030;
    --accent: oklch(68% 0.16 48);
    --accent-ink: oklch(80% 0.12 55);
    --accent-bg: oklch(22% 0.06 45);
    --leaf: oklch(62% 0.12 150);
    --leaf-bg: oklch(20% 0.05 150);
    --sky: oklch(62% 0.13 240);
    --sky-bg: oklch(20% 0.05 240);
    --danger: oklch(62% 0.20 25);
    --shadow: 0 1px 0 rgba(0,0,0,0.2), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
  [data-theme="dark"] .btn:hover { background: var(--bg-2); border-color: var(--ink-2); }
  [data-theme="dark"] .btn.primary { background: var(--ink); color: var(--bg); }
  [data-theme="dark"] .btn.primary:hover { background: #fff; color: #1a1510; }
  [data-theme="dark"] .input, [data-theme="dark"] .textarea, [data-theme="dark"] .select { background: var(--bg-2); }
  [data-theme="dark"] .day-card { background: var(--paper); }
  [data-theme="dark"] .meta-chip { background: rgba(255,255,255,0.06); }
  [data-theme="dark"] .place { background: var(--bg-2); }
  [data-theme="dark"] .file-button { background: var(--bg-2); }
  [data-theme="dark"] .add-place-form { background: var(--bg-2); }
  [data-theme="dark"] .img-uploader { background: var(--bg-2); }
  [data-theme="dark"] .map-picker-menu { background: var(--paper); }
  [data-theme="dark"] .hero { background: radial-gradient(120% 100% at 100% 0%, var(--accent-bg) 0%, transparent 55%), var(--paper); }
  [data-theme="dark"] #search-bar { background: var(--bg-2); }
  [data-theme="dark"] .search-result-match { background: oklch(68% 0.16 48 / 0.25); color: var(--accent-ink); }
  /* Force 24-hour display on webkit time inputs */
  input[type="time"]::-webkit-datetime-edit-ampm-field { display: none; }
  input[type="time"] { -webkit-appearance: none; }

  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button { font-family: inherit; cursor: pointer; }
  input, textarea, select { font-family: inherit; color: inherit; }
  .display { font-family: 'Fraunces', Georgia, serif; font-optical-sizing: auto; letter-spacing: -0.01em; }

  .app { max-width: 1240px; margin: 0 auto; padding: 32px 32px 80px; }
  @media (max-width: 720px) {
    .app { padding: 16px 14px 60px; }
    header.top { margin-bottom: 18px; }
    .brand-mark { width: 34px; height: 34px; font-size: 19px; }
    .brand-text .t { font-size: 22px; }
    .brand-text .s { font-size: 11px; }
    .top-actions .btn { padding: 8px 11px; font-size: 12px; }
    .trip-list { position: static; top: auto; }
    .hero { padding: 20px 18px 18px; }
    .hero h1 { font-size: 28px; }
    .hero-meta { gap: 8px; margin-top: 10px; }
    .meta-chip { font-size: 11.5px; padding: 4px 9px; }
    .section { padding: 18px; }
    .section-head h2, .toggle-btn { font-size: 17px !important; }
    .place { padding: 12px; gap: 10px; grid-template-columns: 36px 1fr; }
    .place .badge { width: 32px; height: 32px; flex: 0 0 32px; }
    .place-thumb { display: none; }
    .place-body { grid-column: 1 / span 2; }
    .place-actions { grid-column: 1 / span 2; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
    .place-actions .btn.icon, .map-link { padding: 6px 9px; }
    .place-tabs { width: 100%; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
    .place-tab { white-space: nowrap; flex-shrink: 0; }
    .day-card { padding: 14px; }
    .day-head .day-num { width: 28px; height: 28px; font-size: 12px; flex: 0 0 28px; }
    .modal { max-width: 100%; }
    .modal-head, .modal-body, .modal-foot { padding-left: 18px; padding-right: 18px; }
  }
  header.top {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; margin-bottom: 28px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 22px; line-height: 1;
  }
  .brand-text { line-height: 1.1; }
  .brand-text .t { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .brand-text .s { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing: 0.04em; text-transform: uppercase; }
  .top-actions { display: flex; gap: 10px; align-items: center; }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--line-strong);
    background: var(--paper); color: var(--ink);
    border-radius: 10px; padding: 9px 14px;
    font-size: 13px; font-weight: 500;
    transition: transform .08s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: #fff; border-color: var(--ink-2); }
  .btn:active { transform: translateY(1px); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .btn.primary:hover { background: #000; }
  .btn.accent { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.accent:hover { filter: brightness(1.05); }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
  .btn.ghost:hover { background: var(--bg-2); }
  .btn.danger { color: var(--danger); }
  .btn.danger:hover { background: #fde7e3; border-color: var(--danger); }
  .btn.icon { padding: 8px; width: 34px; height: 34px; justify-content: center; }
  .btn.sm { padding: 6px 10px; font-size: 12px; }

  .pane { display: grid; grid-template-columns: 320px 1fr; gap: 24px; align-items: start; }
  @media (max-width: 880px) { .pane { grid-template-columns: 1fr; } }

  .trip-list {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    position: sticky; top: 24px;
  }
  .trip-list h3 {
    margin: 0; padding: 14px 16px;
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .trip-item {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer;
    border-bottom: 1px solid var(--line);
    transition: background .12s ease; position: relative;
  }
  .trip-item:last-child { border-bottom: 0; }
  .trip-item:hover { background: var(--bg-2); }
  .trip-item.active { background: var(--accent-bg); }
  .trip-item.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .trip-item .ti-flag {
    width: 28px; height: 28px; border-radius: 8px; flex: 0 0 28px;
    display: grid; place-items: center; font-size: 14px;
    background: var(--bg-2); color: var(--ink-2);
    font-family: 'Fraunces', serif; font-weight: 600;
  }
  .trip-item .ti-body { min-width: 0; flex: 1; }
  .trip-item .ti-title { font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-item .ti-meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-list .add-row { padding: 12px 14px; border-top: 1px solid var(--line); background: var(--bg-2); }
  .empty-state { padding: 32px 20px; text-align: center; color: var(--muted); font-size: 13px; }

  .detail {
    background: var(--paper); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow);
    overflow: hidden; min-height: 420px;
  }
  .detail-empty { padding: 80px 32px; text-align: center; color: var(--muted); }
  .detail-empty .display { font-size: 28px; color: var(--ink); margin-bottom: 8px; }

  .hero {
    padding: 28px 32px 24px;
    border-bottom: 1px solid var(--line);
    background: radial-gradient(120% 100% at 100% 0%, var(--accent-bg) 0%, transparent 55%), var(--paper);
  }
  .hero-row { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; }
  .hero h1 {
    margin: 0; font-family: 'Fraunces', serif; font-weight: 600;
    font-size: 38px; letter-spacing: -0.02em; line-height: 1.05;
  }
  .hero h1[contenteditable]:focus { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 4px; }
  .hero-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
  .meta-chip {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.6); border: 1px solid var(--line);
    padding: 5px 10px; border-radius: 999px; font-size: 12px;
  }
  .meta-chip svg { width: 12px; height: 12px; opacity: .7; }
  .hero-actions { display: flex; gap: 6px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 600;
  }
  .input, .textarea, .select {
    background: #fff; border: 1px solid var(--line-strong);
    border-radius: 9px; padding: 9px 12px; font-size: 14px;
    color: var(--ink); width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .input:focus, .textarea:focus, .select:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-bg);
  }
  .textarea { resize: vertical; min-height: 60px; line-height: 1.5; }

  .section { padding: 22px 32px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .section-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 14px;
  }
  .section-head h2 {
    margin: 0; font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .toggle-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; border: 0; padding: 4px 8px;
    border-radius: 8px; cursor: pointer; color: var(--ink);
    font-family: 'Fraunces', serif; font-size: 20px; font-weight: 600;
    letter-spacing: -0.01em; margin: -4px -8px;
  }
  .toggle-btn:hover { background: var(--bg-2); }
  .toggle-btn .chev {
    width: 14px; height: 14px; transition: transform .15s ease; flex-shrink: 0;
    color: var(--muted);
  }
  .toggle-btn.open .chev { transform: rotate(90deg); }
  .day-head .toggle-btn { font-family: inherit; font-size: 14px; font-weight: 600; }
  .day-head .toggle-btn .chev { width: 12px; height: 12px; }
  .section-head .count { color: var(--muted); font-size: 13px; margin-left: 8px; font-weight: 400; }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

  /* Itinerary */
  .day-card {
    border: 1px solid var(--line); background: #fff;
    border-radius: 12px; margin-bottom: 14px; overflow: hidden;
  }
  .day-head {
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between;
    gap: 12px; border-bottom: 1px solid var(--line); background: var(--bg-2);
  }
  .day-head .day-title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .day-num {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--ink); color: var(--bg);
    display: grid; place-items: center; flex: 0 0 34px;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 16px;
  }
  .day-info .d-date { font-weight: 600; font-size: 14px; color: var(--ink); }
  .day-info .d-label { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .day-actions { display: flex; gap: 4px; }
  .timeline { padding: 6px 16px 14px; }
  /* ── Timeline item — flex layout ───────────────────────── */
  .timeline-item {
    display: flex; flex-direction: row; align-items: flex-start;
    gap: 8px; padding: 12px 0; border-top: 1px dashed var(--line);
    min-width: 0; width: 100%;
  }
  .timeline-item:first-child { border-top: 0; }
  .ti-checkbox { flex: 0 0 auto; display: flex; align-items: flex-start; padding-top: 2px; }
  .drag-handle { flex: 0 0 auto; align-self: center; }
  .ti-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500; color: var(--accent-ink);
    background: var(--accent-bg); border-radius: 7px;
    padding: 4px 6px; text-align: center; line-height: 1.3;
    white-space: nowrap; flex: 0 0 auto; min-width: 36px;
  }
  .ti-time .dur { display: block; font-size: 10px; color: var(--muted); margin-top: 2px; font-weight: 400; }
  .ti-body { min-width: 0; flex: 1 1 0; overflow: hidden; }
  .ti-title { font-weight: 600; font-size: 14px; color: var(--ink); line-height: 1.3; min-width: 0; word-break: break-word; }
  .ti-header-row {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; min-width: 0;
  }
  .ti-header-row .ti-title { flex: 1 1 0; min-width: 0; }
  .ti-actions-inline { display: flex; gap: 2px; align-items: center; flex-shrink: 0; }
  .ti-place {
    font-size: 12.5px; color: var(--muted); margin-top: 3px;
    display: flex; align-items: center; gap: 5px; min-width: 0;
  }
  .ti-place svg { width: 11px; height: 11px; flex-shrink: 0; }
  .ti-place a { color: var(--accent-ink); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .ti-place a:hover { color: var(--accent); }
  .ti-notes {
    font-size: 13px; color: var(--ink-2); margin-top: 5px; line-height: 1.45;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: break-word; min-width: 0;
  }
  .ti-actions { display: flex; gap: 2px; }
  .timeline-empty {
    padding: 18px; text-align: center; color: var(--muted); font-size: 13px;
    border: 1px dashed var(--line-strong); border-radius: 10px; margin-top: 8px;
  }
  /* Editing forms inside timeline */
  .ti-edit {
    display: flex; flex-direction: row; gap: 8px; align-items: flex-start;
    padding: 12px 0; border-top: 1px dashed var(--line);
  }
  .ti-edit > .ti-time { flex-shrink: 0; }
  .ti-edit-form {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px; flex: 1;
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px;
  }
  .ti-edit-form .span2 { grid-column: 1 / span 2; }
  @media (max-width: 600px) {
    .ti-edit-form { grid-template-columns: 1fr; }
    .ti-edit-form .span2 { grid-column: 1; }
  }

  /* Places */
  .place-tabs {
    display: inline-flex; background: var(--bg-2); padding: 3px;
    border-radius: 10px; gap: 2px; margin-bottom: 14px;
    border: 1px solid var(--line); flex-wrap: wrap;
  }
  .place-tab {
    border: 0; background: transparent; padding: 6px 12px;
    border-radius: 8px; font-size: 12px; font-weight: 500;
    color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px;
  }
  .place-tab.active { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .place-tab .pill {
    background: var(--bg); border-radius: 999px; padding: 1px 7px;
    font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .place-tab.active .pill { background: var(--bg-2); color: var(--ink-2); }

  .place-list { display: flex; flex-direction: column; gap: 10px; }
  .place {
    border: 1px solid var(--line); background: #fff; border-radius: 12px;
    padding: 12px 14px; display: grid;
    grid-template-columns: auto auto 1fr auto;
    gap: 14px; align-items: start;
    transition: border-color .15s ease, transform .08s ease;
  }
  .place:hover { border-color: var(--line-strong); }
  .place .badge {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; flex: 0 0 36px;
  }
  .place.food .badge { background: var(--accent-bg); color: var(--accent-ink); }
  .place.attraction .badge { background: var(--leaf-bg); color: var(--leaf); }
  .place.lodging .badge { background: #ece4f5; color: #5b3f8e; }
  .place.transport .badge { background: var(--sky-bg); color: var(--sky); }
  .place.other .badge { background: var(--bg-2); color: var(--ink-2); }
  .place .badge svg { width: 18px; height: 18px; }

  .place-thumb {
    width: 76px; height: 76px; border-radius: 10px;
    background: var(--bg-2); flex: 0 0 76px;
    background-size: cover; background-position: center;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--muted);
  }
  .place-thumb svg { width: 22px; height: 22px; opacity: .55; }
  .place-thumb.has-img { color: transparent; }

  .place-body { min-width: 0; }
  .place-name { font-weight: 600; font-size: 15px; color: var(--ink); margin-bottom: 2px; word-wrap: break-word; }
  .place-addr { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
  .place-note { font-size: 13px; color: var(--ink-2); line-height: 1.5; white-space: pre-wrap; }
  .place-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .map-link {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fff; border: 1px solid var(--line-strong);
    color: var(--ink); padding: 6px 11px; border-radius: 8px;
    font-size: 12px; font-weight: 500; text-decoration: none;
    transition: all .15s ease;
  }
  .map-link:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
  .map-link svg { width: 12px; height: 12px; }

  .place.editing { background: var(--bg-2); border-color: var(--line-strong); }
  .place-edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  @media (max-width: 600px) {
    .place { grid-template-columns: auto 1fr; grid-auto-flow: row; }
    .place-thumb { grid-row: 1; grid-column: 2; width: 100%; height: 140px; }
    .place-body { grid-column: 1 / span 2; }
    .place-actions { grid-column: 1 / span 2; justify-content: flex-end; }
    .place-edit-grid { grid-template-columns: 1fr; }
  }

  /* Image upload */
  /* ── Map picker dropdown ─────────────────────────────── */
  .map-picker { position: relative; display: inline-flex; }
  .map-picker-btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 9px 5px 8px; border-radius: 8px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--line-strong); background: var(--paper); color: var(--ink-2);
    cursor: pointer; transition: background .12s, border-color .12s;
    white-space: nowrap;
  }
  .map-picker-btn svg { width: 13px; height: 13px; flex-shrink: 0; }
  .map-picker-btn:hover { background: #fff; border-color: var(--ink-2); color: var(--ink); }
  .map-picker-caret {
    width: 12px; height: 12px; opacity: .6; margin-left: 1px;
  }
  .map-picker-menu {
    position: absolute; top: calc(100% + 5px); right: 0; z-index: 200;
    background: var(--paper); border: 1px solid var(--line-strong);
    border-radius: 10px; box-shadow: 0 4px 20px -4px rgba(31,27,22,.22);
    min-width: 172px; overflow: hidden;
  }
  .map-picker-menu a {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 13px; font-size: 13px; font-weight: 500;
    color: var(--ink); text-decoration: none;
    transition: background .1s;
  }
  .map-picker-menu a:hover { background: var(--bg-2); }
  .map-picker-menu a + a { border-top: 1px solid var(--line); }
  .map-picker-menu .mp-icon {
    width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 13px;
  }
  .map-picker-menu .mp-icon svg { width: 13px; height: 13px; }
  .mp-google .mp-icon { background: #e8f0fe; color: #1a73e8; }
  .mp-amap   .mp-icon { background: #e6f7ec; color: #0fa958; }
  .mp-sub { display: block; font-size: 10px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  /* ─────────────────────────────────────────────────────── */

  .img-uploader {
    border: 1px dashed var(--line-strong);
    background: #fff; border-radius: 10px;
    padding: 10px; display: flex; gap: 10px; align-items: center;
  }
  .img-preview {
    width: 64px; height: 64px; border-radius: 8px;
    background: var(--bg-2); flex: 0 0 64px;
    background-size: cover; background-position: center;
    border: 1px solid var(--line);
    display: grid; place-items: center;
    color: var(--muted); font-size: 11px;
  }
  .img-uploader-actions { display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .file-button {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-strong); background: #fff;
    border-radius: 8px; padding: 6px 10px; font-size: 12px;
    color: var(--ink-2); cursor: pointer; align-self: flex-start;
  }
  .file-button:hover { background: var(--bg-2); }
  .file-button input { display: none; }

  .add-place-form {
    background: var(--bg-2); border: 1px dashed var(--line-strong);
    border-radius: 12px; padding: 14px;
    display: flex; flex-direction: column; gap: 10px; margin-top: 12px;
  }
  .add-place-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 10px; }
  @media (max-width: 600px) { .add-place-row { grid-template-columns: 1fr; } }
  .place-empty {
    padding: 20px; text-align: center; color: var(--muted); font-size: 13px;
    border: 1px dashed var(--line-strong); border-radius: 12px; background: var(--bg-2);
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,16,10,0.45);
    display: grid; place-items: center; z-index: 50;
    animation: fadeIn .18s ease; padding: 20px;
  }
  .modal {
    background: var(--paper); border-radius: 16px;
    width: 100%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden;
    animation: slideUp .22s ease;
  }
  .modal-head {
    padding: 18px 22px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { margin: 0; font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .modal-body { padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
  .modal-foot {
    padding: 14px 22px; border-top: 1px solid var(--line);
    display: flex; justify-content: flex-end; gap: 8px; background: var(--bg-2);
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .row { display: flex; align-items: center; gap: 8px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); }
  .pill {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
    background: var(--bg-2); color: var(--ink-2); border: 1px solid var(--line);
  }
  .pill.accent { background: var(--accent-bg); color: var(--accent-ink); border-color: transparent; }
  .pill.sky { background: var(--sky-bg); color: var(--sky); border-color: transparent; }
  .inline-confirm {
    display: inline-flex; align-items: center; gap: 6px;
    background: #fde7e3; border: 1px solid var(--danger);
    border-radius: 8px; padding: 4px 8px; font-size: 12px; color: var(--danger);
  }

  /* ── Search bar ─────────────────────────────────────────── */
  #search-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--paper); border: 1px solid var(--line-strong);
    border-radius: 12px; padding: 10px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: var(--transition-theme);
  }
  #search-bar svg { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  #search-bar input {
    flex: 1; border: none; background: transparent; font-size: 14px;
    color: var(--ink); outline: none; font-family: inherit;
  }
  #search-bar input::placeholder { color: var(--muted); }
  #search-clear {
    border: none; background: none; cursor: pointer; color: var(--muted);
    display: flex; align-items: center; padding: 2px;
    border-radius: 4px;
  }
  #search-clear:hover { color: var(--ink); }
  .search-count {
    font-size: 11px; color: var(--muted); white-space: nowrap; font-weight: 500;
  }
  .search-result-match {
    background: oklch(68% 0.16 48 / 0.18); color: var(--accent-ink);
    border-radius: 2px; padding: 0 1px;
  }
  .search-section-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); font-weight: 600; padding: 8px 0 4px;
    border-bottom: 1px solid var(--line); margin-bottom: 8px;
  }

  /* ── Dark mode toggle button ────────────────────────────── */
  .theme-toggle {
    width: 34px; height: 34px; border-radius: 10px; padding: 0;
    border: 1px solid var(--line-strong); background: var(--paper);
    color: var(--ink-2); display: grid; place-items: center; cursor: pointer;
    transition: var(--transition-theme);
    flex-shrink: 0;
  }
  .theme-toggle:hover { background: var(--bg-2); color: var(--ink); }
  .theme-toggle svg { width: 16px; height: 16px; }

  /* ── Activity photo thumbnail ───────────────────────────── */
  .ti-photo {
    width: 52px; height: 52px; border-radius: 8px;
    background: var(--bg-2); background-size: cover; background-position: center;
    border: 1px solid var(--line); flex: 0 0 52px; cursor: zoom-in;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); overflow: hidden; align-self: start;
  }
  .ti-photo svg { width: 16px; height: 16px; opacity: .5; }
  .ti-photo-upload {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: var(--muted); cursor: pointer;
    border: 1px dashed var(--line-strong); border-radius: 6px;
    padding: 4px 8px; margin-top: 4px;
    transition: border-color .12s, color .12s;
  }
  .ti-photo-upload:hover { color: var(--accent-ink); border-color: var(--accent); }
  .ti-photo-upload svg { width: 11px; height: 11px; }
  .ti-photo-upload input { display: none; }

  /* ── Activity photo in ItemEdit form ───────────────────── */
  .item-photo-row {
    grid-column: 1 / span 2;
    display: flex; align-items: center; gap: 10px;
  }
  .item-photo-preview {
    width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
    background: var(--bg-2); background-size: cover; background-position: center;
    border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
    color: var(--muted);
  }
  .item-photo-preview svg { width: 18px; height: 18px; opacity: .4; }

  /* when item has photo, body column gets image before text */
  .ti-body-inner { min-width: 0; }
  .ti-body-with-photo { display: flex; gap: 10px; align-items: flex-start; }
  .img-lightbox {
    position: fixed; inset: 0; background: rgba(15,12,8,0.85);
    display: grid; place-items: center; z-index: 60; cursor: zoom-out;
    padding: 24px;
  }
  .img-lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }

  /* ── Undo Toast ─────────────────────────────────────────── */
  .toast-stack {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    z-index: 100; display: flex; flex-direction: column; gap: 8px;
    align-items: center; pointer-events: none;
  }
  .toast {
    display: inline-flex; align-items: center; gap: 12px;
    background: var(--ink); color: var(--bg);
    border-radius: 12px; padding: 12px 16px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    pointer-events: all; position: relative; overflow: hidden;
    animation: toastIn .2s ease;
  }
  @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .toast-progress {
    position: absolute; bottom: 0; left: 0; height: 3px;
    background: var(--accent); border-radius: 0 0 12px 12px;
    animation: toastBar var(--dur, 5s) linear forwards;
  }
  @keyframes toastBar { from { width:100%; } to { width:0%; } }
  .toast-undo {
    background: var(--accent); color: #fff;
    border: none; border-radius: 7px;
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    cursor: pointer; flex-shrink: 0;
  }
  .toast-undo:hover { filter: brightness(1.1); }

  /* ── Drag handles ───────────────────────────────────────── */
  .drag-handle {
    cursor: grab; color: var(--muted); display: flex; align-items: center;
    padding: 4px 2px; flex-shrink: 0; opacity: 0;
    transition: opacity .12s; touch-action: none;
  }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 14px; height: 14px; }
  .day-card:hover .drag-handle,
  .timeline-item:hover .drag-handle { opacity: 1; }
  .day-card.drag-over { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .timeline-item.drag-over { border-top: 2px solid var(--accent); }
  .day-card.dragging { opacity: .4; }
  .timeline-item.dragging { opacity: .4; }

  /* ── #2 Lock banner ─────────────────────────────────────── */
  .lock-banner {
    display: flex; align-items: center; gap: 8px;
    background: var(--accent-bg); border: 1px solid var(--line-strong);
    color: var(--accent-ink); border-radius: 10px;
    padding: 9px 14px; font-size: 12.5px; font-weight: 500;
    margin-bottom: 16px; animation: bannerIn .2s ease;
  }
  @keyframes bannerIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .lock-banner-btn {
    background: none; border: none; padding: 0;
    color: var(--accent); font-weight: 700; font-size: 12.5px;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }
  .lock-banner-btn:hover { opacity: .8; }

  /* ── #4 Mobile stacked layout ───────────────────────────── */
  .mobile-back-btn {
    display: none; align-items: center; gap: 7px;
    background: none; border: none; padding: 14px 18px 0;
    color: var(--accent-ink); font-size: 13px; font-weight: 600;
    cursor: pointer; width: 100%;
  }
  .mobile-back-btn:hover { opacity: .75; }
  @media (max-width: 880px) {
    .pane { display: block; }
    .pane .trip-list { display: block; }
    .pane .detail { display: none; }
    /* When detail is active on mobile, flip visibility */
    .pane.pane-detail-view .trip-list { display: none; }
    .pane.pane-detail-view .detail { display: block; }
    .mobile-back-btn { display: inline-flex; }
    .lock-banner { margin-bottom: 12px; }
  }
  @media (min-width: 881px) {
    .mobile-back-btn { display: none !important; }
    .pane { display: grid !important; }
    .pane .trip-list { display: block !important; }
    .pane .detail { display: block !important; }
  }

  /* ── #9 Auto-saved flash animation ──────────────────────── */
  .saved-pill { display: inline-flex; align-items: center; gap: 5px; transition: all .25s ease; }
  .saved-pill.saved-flash {
    background: oklch(90% 0.08 150); color: oklch(35% 0.12 150);
    border-color: oklch(75% 0.10 150);
    animation: savedPop .3s ease;
  }
  @keyframes savedPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ── #6 Sort indicator on itinerary header ──────────────── */
  .sort-badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 10.5px; color: var(--muted); font-weight: 500;
    background: var(--bg-2); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 99px; letter-spacing: 0.02em;
  }
  .sort-badge svg { width: 10px; height: 10px; }


  .edit-lock-btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px 6px 9px; border-radius: 20px;
    border: 1.5px solid var(--line-strong);
    background: var(--paper); color: var(--muted);
    font-size: 12.5px; font-weight: 600; cursor: pointer;
    transition: all .18s ease; user-select: none;
    letter-spacing: 0.01em;
  }
  .edit-lock-btn:hover { border-color: var(--accent); color: var(--ink); }
  .edit-lock-btn.edit-lock-on {
    border-color: var(--accent); background: var(--accent-bg);
    color: var(--accent-ink);
  }
  .edit-lock-icon { display: flex; align-items: center; }
  .edit-lock-icon svg { width: 14px; height: 14px; }
  .edit-lock-label { line-height: 1; }
  .edit-lock-pip {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--line-strong); flex-shrink: 0;
    transition: background .18s;
  }
  .edit-lock-pip.on { background: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }

  /* Locked state: mute read-only inputs slightly */
  input[readonly], textarea[readonly], select:disabled {
    opacity: 0.75; cursor: default;
  }


  .ti-checkbox {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; align-self: center;
  }
  .ti-checkbox input[type="checkbox"] { display: none; }
  .ti-checkmark {
    width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
    border: 2px solid var(--line-strong);
    background: var(--paper);
    display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .ti-checkmark svg { width: 10px; height: 10px; color: #fff; }
  .ti-checkbox:hover .ti-checkmark { border-color: var(--accent); }
  .ti-done .ti-checkmark { background: var(--accent); border-color: var(--accent); }
  .ti-done .ti-time { opacity: .4; text-decoration: line-through; }
  .ti-done .ti-title { opacity: .45; text-decoration: line-through; }
  .ti-done .ti-place,
  .ti-done .ti-notes { opacity: .35; }
  .ti-done .ti-photo { opacity: .4; }

  /* ── Print / PDF styles ─────────────────────────────────── */
  @media print {
    @page { margin: 18mm 16mm; size: A4; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body > * { display: none !important; }
    #print-frame { display: block !important; }
    body { background: #fff !important; }
  }
  #print-frame {
    display: none;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 13px; color: #1f1b16; line-height: 1.5;
  }
  #print-frame h1 { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; margin: 0 0 6px; letter-spacing: -0.02em; }
  #print-frame h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 600; margin: 0 0 10px; letter-spacing: -0.01em; }
  #print-frame .pf-meta { font-size: 12px; color: #6b6056; display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 32px; }
  #print-frame .pf-section-label {
    font-size: 9.5px; letter-spacing: 0.13em; text-transform: uppercase;
    font-weight: 700; color: #8a7f70; border-bottom: 1px solid #e3d9c6;
    padding-bottom: 5px; margin: 28px 0 14px;
  }
  #print-frame .pf-day-head {
    display: flex; align-items: center; gap: 10px;
    background: #f0ebe0; border-radius: 8px;
    padding: 9px 14px; margin-bottom: 8px;
  }
  #print-frame .pf-day-num {
    width: 28px; height: 28px; border-radius: 7px;
    background: #1f1b16; color: #f6f1e8;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 600; font-size: 14px; flex-shrink: 0;
  }
  #print-frame .pf-day-title { font-weight: 600; font-size: 13px; }
  #print-frame .pf-day-label { font-size: 11px; color: #8a7f70; }
  #print-frame .pf-item {
    display: grid; grid-template-columns: 64px 1fr;
    gap: 10px; padding: 7px 0 7px 14px;
    border-left: 2px solid #e3d9c6; margin-bottom: 4px;
  }
  #print-frame .pf-time { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #7a5c3a; font-weight: 500; padding-top: 1px; }
  #print-frame .pf-item-title { font-weight: 600; font-size: 13px; }
  #print-frame .pf-item-loc { font-size: 11px; color: #8a7f70; margin-top: 2px; }
  #print-frame .pf-item-notes { font-size: 12px; color: #4a4239; margin-top: 3px; white-space: pre-wrap; }
  #print-frame .pf-place-row {
    display: grid; grid-template-columns: 22px 1fr;
    gap: 8px; padding: 7px 0; border-bottom: 1px solid #f0ebe0; align-items: start;
  }
  #print-frame .pf-place-row:last-child { border-bottom: 0; }
  #print-frame .pf-badge {
    width: 18px; height: 18px; border-radius: 4px; background: #f0ebe0;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; color: #8a7f70; font-weight: 700; flex-shrink: 0; margin-top: 1px;
  }
  #print-frame .pf-place-name { font-weight: 600; font-size: 12.5px; }
  #print-frame .pf-place-addr { font-size: 11px; color: #8a7f70; }
  #print-frame .pf-place-note { font-size: 11px; color: #4a4239; margin-top: 2px; }
  #print-frame .pf-footer {
    margin-top: 40px; padding-top: 12px; border-top: 1px solid #e3d9c6;
    font-size: 10px; color: #b0a898; text-align: center;
  }
</style>

<body>
  <div id="root"></div>
  <div id="print-frame"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" data-presets="env,react">
  const { useState, useEffect, useMemo, useRef, useCallback } = React;

  /* ---------- Storage ---------- */
  const STORAGE_KEY = 'travelplan.v5';
  const uid = () => Math.random().toString(36).slice(2, 10);

  /* ---------- Time helpers (24-hour display) ---------- */
  // Accepts "HH:MM" or "H:MM" strings stored by <input type="time">
  // Returns e.g. "09:30" or "21:45" — always 24-hour, zero-padded
  const formatTime24 = (t) => {
    if (!t) return '—';
    const [h, m] = t.split(':');
    if (h === undefined || m === undefined) return t;
    return `${String(Number(h)).padStart(2, '0')}:${String(Number(m)).padStart(2, '0')}`;
  };

  /* ── Toast / Undo system ─────────────────────────────────
     Components call pushToast({ message, onUndo }) and get back
     a dismiss function. The App renders <ToastStack toasts={toasts} />.
  ──────────────────────────────────────────────────────── */
  let _setToasts = null;
  const TOAST_MS = 5000;

  function pushToast({ message, onUndo }) {
    const id = uid();
    const timer = setTimeout(() => {
      _setToasts && _setToasts(ts => ts.filter(t => t.id !== id));
    }, TOAST_MS);
    const dismiss = (runUndo = false) => {
      clearTimeout(timer);
      if (runUndo && onUndo) onUndo();
      _setToasts && _setToasts(ts => ts.filter(t => t.id !== id));
    };
    _setToasts && _setToasts(ts => [...ts, { id, message, dismiss, hasUndo: !!onUndo }]);
    return dismiss;
  }

  function ToastStack() {
    const [toasts, setToasts] = useState([]);
    useEffect(() => { _setToasts = setToasts; return () => { _setToasts = null; }; }, []);
    if (!toasts.length) return null;
    return (
      <div className="toast-stack">
        {toasts.map(t => (
          <div key={t.id} className="toast">
            <span>{t.message}</span>
            {t.hasUndo && (
              <button className="toast-undo" onClick={() => t.dismiss(true)}>Undo</button>
            )}
            <div className="toast-progress" style={{ '--dur': TOAST_MS + 'ms' }} />
          </div>
        ))}
      </div>
    );
  }

  /* ── PDF / Print export ──────────────────────────────────
     Builds static HTML into #print-frame, calls window.print(),
     then clears the frame. Works with the @media print CSS above.
  ──────────────────────────────────────────────────────── */
  const KIND_ABBR = { food:'🍴', attraction:'📷', lodging:'🛏', transport:'🚆', other:'📌' };

  function exportTripPDF(trip) {
    const frame = document.getElementById('print-frame');
    if (!frame) return;

    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const fmtD = (iso) => { if (!iso) return ''; const d = new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };

  const fileToDataURL = (file, maxDim = 1400) => new Promise((resolve, reject) => {
    if (!file) return resolve('');
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const r = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * r); height = Math.round(height * r);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
