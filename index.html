    useEffect(() => {
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    }, [dark]);

    useEffect(() => {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(trips)); }
      catch (e) { console.warn('Storage full — image too large?', e); }
      // Flash the saved indicator
      setSavedFlash(true);
      clearTimeout(saveFlashTimer.current);
      saveFlashTimer.current = setTimeout(() => setSavedFlash(false), 1800);
    }, [trips]);

    const selected = trips.find(t => t.id === selectedId) || null;

    const updateTrip = (id, patch) => setTrips(ts => ts.map(t => t.id === id ? { ...t, ...patch } : t));

    /* Soft-delete trip with undo */
    const deleteTrip = (id) => {
      const snapshot = trips.find(t => t.id === id);
      const prevSelected = selectedId;
      setTrips(ts => ts.filter(t => t.id !== id));
      if (selectedId === id) {
        const remaining = trips.filter(t => t.id !== id);
        setSelectedId(remaining[0]?.id || null);
      }
      pushToast({
        message: `Trip "${snapshot?.title || 'Untitled'}" deleted`,
        onUndo: () => {
          setTrips(ts => {
            const idx = ts.findIndex(t => t.id > id);
            const copy = [...ts];
            copy.splice(idx === -1 ? copy.length : idx, 0, snapshot);
            return copy;
          });
          setSelectedId(prevSelected);
        },
      });
    };

    const createTrip = (data) => {
      const trip = {
        id: uid(), title: data.title || 'Untitled trip',
        destination: data.destination || '', origin: data.origin || '',
        startDate: data.startDate || '', endDate: data.endDate || '',
        travelers: data.travelers || 1, budget: '', currency: 'HKD',
        notes: '', itinerary: [], places: [],
      };
      setTrips(ts => [trip, ...ts]);
      setSelectedId(trip.id);
    };

    /* Itinerary */
    const addDay = (tripId, date) => {
      const day = { id: uid(), date: date || '', label: '', items: [] };
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: [...t.itinerary, day].sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      } : t));
    };
    const updateDay = (tripId, dayId, patch) => {
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: t.itinerary.map(d => d.id === dayId ? { ...d, ...patch } : d)
                                    .sort((a, b) => (a.date || '').localeCompare(b.date || ''))
      } : t));
    };

    /* Soft-delete day with undo */
    const deleteDay = (tripId, dayId) => {
      const trip = trips.find(t => t.id === tripId);
      const snapshot = trip?.itinerary.find(d => d.id === dayId);
      const snapIdx = trip?.itinerary.findIndex(d => d.id === dayId) ?? -1;
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: t.itinerary.filter(d => d.id !== dayId)
      } : t));
      pushToast({
        message: `Day "${snapshot?.label || fmtDayHeader(snapshot?.date) || 'Day'}" deleted`,
        onUndo: () => setTrips(ts => ts.map(t => t.id === tripId ? {
          ...t, itinerary: (() => {
            const copy = [...t.itinerary];
            copy.splice(snapIdx === -1 ? copy.length : snapIdx, 0, snapshot);
            return copy;
          })()
        } : t)),
      });
    };

    /* Drag-reorder days */
    const reorderDays = (tripId, fromId, toId) => {
      setTrips(ts => ts.map(t => {
        if (t.id !== tripId) return t;
        const arr = [...t.itinerary];
        const from = arr.findIndex(d => d.id === fromId);
        const to   = arr.findIndex(d => d.id === toId);
        if (from === -1 || to === -1 || from === to) return t;
        const [item] = arr.splice(from, 1);
        arr.splice(to, 0, item);
        return { ...t, itinerary: arr };
      }));
    };

    const addItem = (tripId, dayId, item) => {
      const newItem = { id: uid(), time: '', duration: '', title: '', location: '', notes: '', ...item };
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: t.itinerary.map(d => d.id === dayId ? {
          ...d, items: [...d.items, newItem].sort((a, b) => (a.time || '').localeCompare(b.time || ''))
        } : d)
      } : t));
    };
    const updateItem = (tripId, dayId, itemId, patch) => {
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: t.itinerary.map(d => d.id === dayId ? {
          ...d, items: d.items.map(it => it.id === itemId ? { ...it, ...patch } : it)
                              .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
        } : d)
      } : t));
    };

    /* Soft-delete item with undo */
    const deleteItem = (tripId, dayId, itemId) => {
      const day = trips.find(t => t.id === tripId)?.itinerary.find(d => d.id === dayId);
      const snapshot = day?.items.find(it => it.id === itemId);
      const snapIdx  = day?.items.findIndex(it => it.id === itemId) ?? -1;
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, itinerary: t.itinerary.map(d => d.id === dayId ? {
          ...d, items: d.items.filter(it => it.id !== itemId)
        } : d)
      } : t));
      pushToast({
        message: `"${snapshot?.title || 'Activity'}" deleted`,
        onUndo: () => setTrips(ts => ts.map(t => t.id === tripId ? {
          ...t, itinerary: t.itinerary.map(d => d.id === dayId ? {
            ...d, items: (() => {
              const copy = [...d.items];
              copy.splice(snapIdx === -1 ? copy.length : snapIdx, 0, snapshot);
              return copy.sort((a,b) => (a.time||'').localeCompare(b.time||''));
            })()
          } : d)
        } : t)),
      });
    };

    /* Drag-reorder items within a day */
    const reorderItems = (tripId, dayId, fromId, toId) => {
      setTrips(ts => ts.map(t => {
        if (t.id !== tripId) return t;
        return {
          ...t, itinerary: t.itinerary.map(d => {
            if (d.id !== dayId) return d;
            const arr = [...d.items];
            const from = arr.findIndex(it => it.id === fromId);
            const to   = arr.findIndex(it => it.id === toId);
            if (from === -1 || to === -1 || from === to) return d;
            const [item] = arr.splice(from, 1);
            arr.splice(to, 0, item);
            return { ...d, items: arr };
          })
        };
      }));
    };

    /* Places */
    const addPlace = (tripId, place) => {
      const p = { id: uid(), kind: 'other', name: '', address: '', notes: '', image: '', ...place };
      setTrips(ts => ts.map(t => t.id === tripId ? { ...t, places: [...t.places, p] } : t));
    };
    const updatePlace = (tripId, placeId, patch) => {
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, places: t.places.map(p => p.id === placeId ? { ...p, ...patch } : p)
      } : t));
    };

    /* Soft-delete place with undo */
    const deletePlace = (tripId, placeId) => {
      const snapshot = trips.find(t => t.id === tripId)?.places.find(p => p.id === placeId);
      const snapIdx  = trips.find(t => t.id === tripId)?.places.findIndex(p => p.id === placeId) ?? -1;
      setTrips(ts => ts.map(t => t.id === tripId ? {
        ...t, places: t.places.filter(p => p.id !== placeId)
      } : t));
      pushToast({
        message: `"${snapshot?.name || 'Place'}" deleted`,
        onUndo: () => setTrips(ts => ts.map(t => t.id === tripId ? {
          ...t, places: (() => {
            const copy = [...t.places];
            copy.splice(snapIdx === -1 ? copy.length : snapIdx, 0, snapshot);
            return copy;
          })()
        } : t)),
      });
    };

    const [searchQuery, setSearchQuery] = useState('');

    return (
      <div className="app">
        <Header
          onNewTrip={() => setModal({ type: 'new-trip' })}
          onExport={() => exportJSON(trips)}
          onPrint={() => selected && exportTripPDF(selected)}
          hasSelected={!!selected}
          dark={dark}
          onToggleDark={() => setDark(d => !d)}
          editMode={editMode}
          onToggleEdit={() => setEditMode(m => !m)}
          savedFlash={savedFlash}
        />

        {/* ── Locked banner ── */}
        {!editMode && selected && (
          <div className="lock-banner">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={{ width: 13, height: 13, flexShrink: 0 }}>
              <rect x="3" y="7" width="10" height="7" rx="2"/>
              <path d="M5 7V4.5a3 3 0 0 1 6 0v2.5"/>
            </svg>
            View only — <button className="lock-banner-btn" onClick={() => setEditMode(true)}>tap to enable editing</button>
          </div>
        )}

        <div className={`pane${showDetail ? ' pane-detail-view' : ''}`}>
          <TripList trips={trips} selectedId={selectedId}
                    onSelect={(id) => { setSelectedId(id); setSearchQuery(''); setShowDetail(true); }}
                    onNew={() => setModal({ type: 'new-trip' })} />
          {selected ? (
            <TripDetail
              trip={selected}
              searchQuery={searchQuery}
              onSearchChange={setSearchQuery}
              onUpdate={(patch) => editMode && updateTrip(selected.id, patch)}
              onDelete={() => editMode && deleteTrip(selected.id)}
              onAddDay={(date) => editMode && addDay(selected.id, date)}
              onUpdateDay={(did, patch) => editMode && updateDay(selected.id, did, patch)}
              onDeleteDay={(did) => editMode && deleteDay(selected.id, did)}
              onAddItem={(did, it) => editMode && addItem(selected.id, did, it)}
              onUpdateItem={(did, iid, patch) => updateItem(selected.id, did, iid, patch)}
              onDeleteItem={(did, iid) => editMode && deleteItem(selected.id, did, iid)}
              onReorderDays={(fromId, toId) => editMode && reorderDays(selected.id, fromId, toId)}
              onReorderItems={(did, fromId, toId) => editMode && reorderItems(selected.id, did, fromId, toId)}
              onAddPlace={(p) => editMode && addPlace(selected.id, p)}
              onUpdatePlace={(pid, patch) => editMode && updatePlace(selected.id, pid, patch)}
              onDeletePlace={(pid) => editMode && deletePlace(selected.id, pid)}
              onShowImage={setLightbox}
              editMode={editMode}
              onBack={() => setShowDetail(false)}
              savedFlash={savedFlash}
            />
          ) : (
            <div className="detail">
              <div className="detail-empty">
                <Icon name="compass" style={{ width: 56, height: 56, color: 'var(--muted)', marginBottom: 16 }} />
                <div className="display">No trips yet</div>
                <div style={{ marginBottom: 18 }}>Plan your first adventure to get started.</div>
                <button className="btn primary" onClick={() => setModal({ type: 'new-trip' })}>
                  <Icon name="plus" style={{ width: 14, height: 14 }} /> New trip
                </button>
              </div>
            </div>
          )}
        </div>

        {modal?.type === 'new-trip' && (
          <NewTripModal onClose={() => setModal(null)}
                        onCreate={(data) => { createTrip(data); setModal(null); }} />
        )}
        {lightbox && (
          <div className="img-lightbox" onClick={() => setLightbox(null)}>
            <img src={lightbox} alt="" />
          </div>
        )}
        <ToastStack />
      </div>
    );
  }

  /* ---------- Header ---------- */
  function Header({ onNewTrip, onExport, onPrint, hasSelected, dark, onToggleDark, editMode, onToggleEdit, savedFlash }) {
    return (
      <header className="top">
        <div className="brand">
          <div className="brand-mark">T</div>
          <div className="brand-text">
            <div className="t">Travel Plan</div>
            <div className="s">Plan · Schedule · Map</div>
          </div>
        </div>
        <div className="top-actions">
          {/* Edit-lock toggle */}
          <button
            className={`edit-lock-btn${editMode ? ' edit-lock-on' : ''}`}
            onClick={onToggleEdit}
            title={editMode ? 'Lock — disable editing' : 'Unlock — enable editing'}
          >
            <span className="edit-lock-icon">
              {editMode ? (
                /* unlocked icon */
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="7" width="10" height="7" rx="2"/>
                  <path d="M5 7V4.5a3 3 0 0 1 6 0"/>
                </svg>
              ) : (
                /* locked icon */
                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="3" y="7" width="10" height="7" rx="2"/>
                  <path d="M5 7V4.5a3 3 0 0 1 6 0v2.5"/>
                </svg>
              )}
            </span>
            <span className="edit-lock-label">{editMode ? 'Editing' : 'Locked'}</span>
            <span className={`edit-lock-pip${editMode ? ' on' : ''}`}></span>
          </button>
          <button className="theme-toggle" onClick={onToggleDark} title={dark ? 'Switch to light mode' : 'Switch to dark mode'}>
            <Icon name={dark ? 'sun' : 'moon'} />
          </button>
          <button className="btn ghost" onClick={onExport} title="Export all trips as JSON">
            <Icon name="download" style={{ width: 14, height: 14 }} /> Export
          </button>
          {hasSelected && (
            <button className="btn ghost" onClick={onPrint} title="Save current trip as PDF for offline use">
              <Icon name="pdf" style={{ width: 14, height: 14 }} /> Save PDF
            </button>
          )}
          <button className="btn accent" onClick={onNewTrip}>
            <Icon name="plus" style={{ width: 14, height: 14 }} /> New trip
          </button>
        </div>
      </header>
    );
  }

  function exportJSON(trips) {
    const blob = new Blob([JSON.stringify(trips, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `travel-plans-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---------- Trip list ---------- */
  function TripList({ trips, selectedId, onSelect, onNew }) {
    return (
      <aside className="trip-list">
        <h3>
          <span>Your Trips</span>
          <span className="muted" style={{ fontWeight: 400, textTransform: 'none', letterSpacing: 0 }}>{trips.length}</span>
        </h3>
        {trips.length === 0 ? (
          <div className="empty-state">
            No trips yet.<br/>
            <button className="btn sm primary" style={{ marginTop: 10 }} onClick={onNew}>Create one</button>
          </div>
        ) : (
          trips.map(t => (
            <div key={t.id} className={`trip-item ${t.id === selectedId ? 'active' : ''}`} onClick={() => onSelect(t.id)}>
              <div className="ti-flag">{initialOf(t.destination || t.title)}</div>
              <div className="ti-body">
                <div className="ti-title">{t.title || 'Untitled trip'}</div>
                <div className="ti-meta">
                  {t.destination ? `${t.destination} · ` : ''}{fmtDateRange(t.startDate, t.endDate)}
                </div>
              </div>
            </div>
          ))
        )}
        <div className="add-row">
          <button className="btn" style={{ width: '100%', justifyContent: 'center' }} onClick={onNew}>
            <Icon name="plus" style={{ width: 14, height: 14 }} /> New trip
          </button>
        </div>
      </aside>
    );
  }

  /* ── Highlight matching text ──────────────────────────── */
  function Highlight({ text, query }) {
    if (!query || !text) return <>{text || ''}</>;
    const idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) return <>{text}</>;
    return <>{text.slice(0, idx)}<mark className="search-result-match">{text.slice(idx, idx + query.length)}</mark>{text.slice(idx + query.length)}</>;
  }

  /* ---------- Trip detail ---------- */
  function TripDetail(props) {
    const [openDays, setOpenDays] = useState(() => new Set());
    const toggleDay = (id) => setOpenDays(s => { const n = new Set(s); n.has(id) ? n.delete(id) : n.add(id); return n; });
    const { trip, onUpdate, onDelete,
            onAddDay, onUpdateDay, onDeleteDay,
            onAddItem, onUpdateItem, onDeleteItem,
            onReorderDays, onReorderItems,
            onAddPlace, onUpdatePlace, onDeletePlace,
            onShowImage, searchQuery, onSearchChange, editMode, onBack, savedFlash } = props;
    const [placeFilter, setPlaceFilter] = useState('all');
    const [cityFilter, setCityFilter] = useState('all');
    const [detailsOpen, setDetailsOpen] = useState(false);
    const searchRef = useRef(null);
    const q = (searchQuery || '').toLowerCase().trim();

    /* Search logic */
    const matchedItems = useMemo(() => {
      if (!q) return [];
      const results = [];
      trip.itinerary.forEach(day => {
        day.items.forEach(item => {
          const hay = [item.title, item.location, item.notes].join(' ').toLowerCase();
          if (hay.includes(q)) results.push({ type: 'item', day, item });
        });
        const dayHay = [day.label, day.date].join(' ').toLowerCase();
        if (dayHay.includes(q) && day.items.length === 0) results.push({ type: 'day', day });
      });
      return results;
    }, [q, trip.itinerary]);

    const matchedPlaces = useMemo(() => {
      if (!q) return [];
      return trip.places.filter(p => {
        const hay = [p.name, p.address, p.notes, p.city].join(' ').toLowerCase();
        return hay.includes(q);
      });
    }, [q, trip.places]);

    const totalMatches = matchedItems.length + matchedPlaces.length;

    const counts = useMemo(() => {
      const c = { all: trip.places.length, food: 0, attraction: 0, lodging: 0, transport: 0, other: 0 };
      const base = cityFilter === 'all' ? trip.places : trip.places.filter(p => (p.city || '') === cityFilter);
      base.forEach(p => { c[p.kind] = (c[p.kind] || 0) + 1; }); c.all = base.length;
      return c;
    }, [trip.places, cityFilter]);

    const cities = useMemo(() => {
      const s = new Set(); trip.places.forEach(p => { if (p.city) s.add(p.city); });
      return Array.from(s).sort();
    }, [trip.places]);

    const visible = trip.places.filter(p =>
      (placeFilter === 'all' || p.kind === placeFilter) &&
      (cityFilter === 'all' || (p.city || '') === cityFilter)
    );
    const dur = tripDuration(trip.startDate, trip.endDate);
    const totalActivities = useMemo(() => trip.itinerary.reduce((s, d) => s + d.items.length, 0), [trip.itinerary]);

    /* Keyboard shortcut: Cmd/Ctrl+K focuses search */
    useEffect(() => {
      const handler = (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
          e.preventDefault();
          searchRef.current?.focus();
        }
      };
      window.addEventListener('keydown', handler);
      return () => window.removeEventListener('keydown', handler);
    }, []);

    return (
      <main className="detail">
        {/* Mobile back button */}
        <button className="mobile-back-btn" onClick={onBack}>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ width: 16, height: 16 }}>
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
          All trips
        </button>
        <div className="hero">
          <div className="hero-row">
            <div style={{ flex: 1, minWidth: 0 }}>
              <h1 contentEditable={editMode} suppressContentEditableWarning
                  style={{ cursor: editMode ? 'text' : 'default', outline: 'none' }}
                  onBlur={(e) => editMode && onUpdate({ title: e.currentTarget.textContent.trim() || 'Untitled trip' })}
                  onKeyDown={(e) => { if (e.key === 'Enter') { e.preventDefault(); e.currentTarget.blur(); } }}>
                {trip.title}
              </h1>
              <div className="hero-meta">
                {trip.origin && <span className="meta-chip"><Icon name="route" /> from {trip.origin}</span>}
                <span className="meta-chip"><Icon name="pin" /> {trip.destination || 'Add destination'}</span>
                <span className="meta-chip"><Icon name="calendar" /> {fmtDateRange(trip.startDate, trip.endDate)}{dur ? ` · ${dur} days` : ''}</span>
                <span className="meta-chip"><Icon name="users" /> {trip.travelers || 1} traveler{(trip.travelers || 1) > 1 ? 's' : ''}</span>
                {trip.budget && <span className="meta-chip"><Icon name="wallet" /> {trip.currency} {Number(trip.budget).toLocaleString()}</span>}
                <span className="meta-chip"><Icon name="clock" /> {totalActivities} activities</span>
              </div>
            </div>
            <div className="hero-actions">
              {editMode && (
                <button className="btn icon danger" onClick={onDelete} title="Delete trip">
                  <Icon name="trash" style={{ width: 16, height: 16 }} />
                </button>
              )}
            </div>
          </div>
        </div>

        {/* ── Search bar ── */}
        <div style={{ padding: '16px 32px 0' }}>
          <div id="search-bar">
            <Icon name="search" />
            <input
              ref={searchRef}
              type="text"
              placeholder="Search activities, places, notes… (⌘K)"
              value={searchQuery}
              onChange={e => onSearchChange(e.target.value)}
            />
            {searchQuery && (
              <>
                <span className="search-count">{totalMatches} result{totalMatches !== 1 ? 's' : ''}</span>
                <button id="search-clear" onClick={() => onSearchChange('')} title="Clear search">
                  <Icon name="x" style={{ width: 14, height: 14 }} />
                </button>
              </>
            )}
          </div>
        </div>

        {/* ── Search results overlay ── */}
        {q && (
          <div style={{ padding: '8px 32px 16px' }}>
            {totalMatches === 0 && (
              <div className="place-empty" style={{ marginTop: 0 }}>No results for "{searchQuery}"</div>
            )}

            {matchedItems.length > 0 && (
              <>
                <div className="search-section-label">Activities · {matchedItems.length} match{matchedItems.length !== 1 ? 'es' : ''}</div>
                {matchedItems.map(({ day, item }, i) => item ? (
                  <div key={i} style={{ padding: '8px 0 8px 14px', borderLeft: '2px solid var(--line)', marginBottom: 6 }}>
                    <div style={{ fontSize: 10, color: 'var(--muted)', marginBottom: 3, textTransform: 'uppercase', letterSpacing: '0.08em' }}>
                      {fmtDayHeader(day.date)}{day.label ? ` · ${day.label}` : ''}
                    </div>
                    <div style={{ display: 'flex', gap: 10, alignItems: 'start' }}>
                      {item.image && (
                        <div style={{ width: 40, height: 40, borderRadius: 6, backgroundImage: `url(${item.image})`, backgroundSize: 'cover', backgroundPosition: 'center', flexShrink: 0, cursor: 'zoom-in' }}
                             onClick={() => onShowImage(item.image)} />
                      )}
                      <div>
                        <div style={{ fontWeight: 600, fontSize: 13 }}><Highlight text={item.title} query={searchQuery} /></div>
                        {item.location && <div style={{ fontSize: 12, color: 'var(--muted)', marginTop: 2 }}>📍 <Highlight text={item.location} query={searchQuery} /></div>}
                        {item.notes && <div style={{ fontSize: 12, color: 'var(--ink-2)', marginTop: 2 }}><Highlight text={item.notes} query={searchQuery} /></div>}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div key={i} style={{ padding: '6px 0 6px 14px', borderLeft: '2px solid var(--line)', marginBottom: 4, fontSize: 13, color: 'var(--muted)' }}>
                    <Highlight text={day.label || fmtDayHeader(day.date)} query={searchQuery} />
                  </div>
                ))}
              </>
            )}

            {matchedPlaces.length > 0 && (
              <>
                <div className="search-section-label" style={{ marginTop: matchedItems.length ? 16 : 0 }}>
                  Places · {matchedPlaces.length} match{matchedPlaces.length !== 1 ? 'es' : ''}
                </div>
                {matchedPlaces.map(p => (
                  <div key={p.id} style={{ display: 'flex', gap: 10, alignItems: 'start', padding: '7px 0', borderBottom: '1px solid var(--line)' }}>
                    {p.image && (
                      <div style={{ width: 40, height: 40, borderRadius: 6, backgroundImage: `url(${p.image})`, backgroundSize: 'cover', backgroundPosition: 'center', flexShrink: 0, cursor: 'zoom-in' }}
                           onClick={() => onShowImage(p.image)} />
                    )}
                    <div>
                      <div style={{ fontWeight: 600, fontSize: 13 }}><Highlight text={p.name} query={searchQuery} /></div>
                      {p.city && <span style={{ fontSize: 10, color: 'var(--muted)' }}>{p.city}</span>}
                      {p.address && <div style={{ fontSize: 12, color: 'var(--muted)' }}>📍 <Highlight text={p.address} query={searchQuery} /></div>}
                      {p.notes && <div style={{ fontSize: 12, color: 'var(--ink-2)' }}><Highlight text={p.notes} query={searchQuery} /></div>}
                    </div>
                  </div>
                ))}
              </>
            )}
          </div>
        )}

        {/* ── Normal content (hidden when searching) ── */}
        {!q && (
          <>
        {/* Details */}
        <div className="section">
          <div className="section-head">
            <button className={`toggle-btn ${detailsOpen ? 'open' : ''}`} onClick={() => setDetailsOpen(o => !o)}>
              <svg className="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
              Trip details
            </button>
            <span className={`pill saved-pill${savedFlash ? ' saved-flash' : ''}`}>
              {savedFlash ? (
                <><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{ width: 10, height: 10 }}><polyline points="2,6 5,9 10,3"/></svg> Saved</>
              ) : 'Auto-saved'}
            </span>
          </div>
          {detailsOpen && (<><div className="grid-3" style={{ marginBottom: 14 }}>
            <div className="field"><label>Departure from</label>
              <input className="input" value={trip.origin || ''} placeholder="City, Country" readOnly={!editMode} onChange={(e) => editMode && onUpdate({ origin: e.target.value })} /></div>
            <div className="field"><label>Destination</label>
              <input className="input" value={trip.destination} placeholder="City, Country" readOnly={!editMode} onChange={(e) => editMode && onUpdate({ destination: e.target.value })} /></div>
            <div className="field"><label>Travelers</label>
              <input className="input" type="number" min="1" value={trip.travelers} readOnly={!editMode} onChange={(e) => editMode && onUpdate({ travelers: Math.max(1, Number(e.target.value) || 1) })} /></div>
          </div>
          <div className="grid-3" style={{ marginBottom: 14 }}>
            <div className="field"><label>Start date</label>
              <input className="input" type="date" value={trip.startDate} readOnly={!editMode} onChange={(e) => editMode && onUpdate({ startDate: e.target.value })} /></div>
            <div className="field"><label>End date</label>
              <input className="input" type="date" value={trip.endDate} readOnly={!editMode} onChange={(e) => editMode && onUpdate({ endDate: e.target.value })} /></div>
            <div className="field"><label>Budget ({trip.currency})</label>
              <div style={{ display: 'flex', gap: 6 }}>
                <input className="input" type="number" min="0" placeholder="0" value={trip.budget} readOnly={!editMode} onChange={(e) => editMode && onUpdate({ budget: e.target.value })} />
                <select className="select" value={trip.currency} style={{ width: 90 }} disabled={!editMode} onChange={(e) => editMode && onUpdate({ currency: e.target.value })}>
                  {['HKD','THB','CNY'].map(c => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
            </div>
          </div>
          <div className="field"><label>Notes</label>
            <textarea className="textarea" rows="3" placeholder="Reminders, packing list, reservations…"
              value={trip.notes} readOnly={!editMode} onChange={(e) => editMode && onUpdate({ notes: e.target.value })} /></div></>)}
        </div>

        {/* Itinerary */}
        <div className="section">
          <div className="section-head">
            <h2>Itinerary <span className="count">· {trip.itinerary.length} days · {totalActivities} activities</span>
              {totalActivities > 0 && (
                <span className="sort-badge" style={{ marginLeft: 10 }}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
                  sorted by time
                </span>
              )}
            </h2>
            {trip.itinerary.length > 0 && (
              <button className="btn sm ghost" onClick={() => {
                const allOpen = trip.itinerary.every(d => openDays.has(d.id));
                setOpenDays(allOpen ? new Set() : new Set(trip.itinerary.map(d => d.id)));
              }}>
                {trip.itinerary.every(d => openDays.has(d.id)) ? 'Collapse all' : 'Expand all'}
              </button>
            )}
          </div>
          {trip.itinerary.length === 0 ? (
            <div className="place-empty">No days planned yet — add your first day below.</div>
          ) : (
            trip.itinerary.map((day, idx) => (
              <DayCard key={day.id} day={day} index={idx + 1}
                open={openDays.has(day.id)}
                onToggle={() => toggleDay(day.id)}
                onUpdate={(patch) => onUpdateDay(day.id, patch)}
                onDelete={() => onDeleteDay(day.id)}
                onAddItem={(it) => onAddItem(day.id, it)}
                onUpdateItem={(iid, patch) => onUpdateItem(day.id, iid, patch)}
                onDeleteItem={(iid) => onDeleteItem(day.id, iid)}
                onReorderItems={(fromId, toId) => onReorderItems(day.id, fromId, toId)}
                onDragOver={(fromId) => onReorderDays(fromId, day.id)}
                onShowImage={onShowImage}
                editMode={editMode}
              />
            ))
          )}
          {editMode && (
          <AddDayInline tripStart={trip.startDate} tripEnd={trip.endDate}
                        existing={trip.itinerary.map(d => d.date)}
                        onAdd={(date) => onAddDay(date)} />
          )}
        </div>

        {/* Places */}
        <div className="section">
          <div className="section-head">
            <h2>Places <span className="count">· {trip.places.length} saved</span></h2>
          </div>
          {cities.length > 0 && (
            <div style={{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 12, flexWrap: 'wrap' }}>
              <span className="muted" style={{ fontSize: 12, fontWeight: 500 }}>City:</span>
              <button className={`place-tab ${cityFilter === 'all' ? 'active' : ''}`}
                      style={{ background: cityFilter === 'all' ? 'var(--accent-bg)' : 'var(--bg-2)', border: '1px solid var(--line)' }}
                      onClick={() => setCityFilter('all')}>
                All cities <span className="pill">{trip.places.length}</span>
              </button>
              {cities.map(c => {
                const count = trip.places.filter(p => p.city === c).length;
                return (
                  <button key={c} className={`place-tab ${cityFilter === c ? 'active' : ''}`}
                          style={{ background: cityFilter === c ? 'var(--accent-bg)' : 'var(--bg-2)', border: '1px solid var(--line)' }}
                          onClick={() => setCityFilter(c)}>
                    <Icon name="pin" style={{ width: 11, height: 11 }} />{c}
                    <span className="pill">{count}</span>
                  </button>
                );
              })}
            </div>
          )}
          <div className="place-tabs">
            {[
              { id: 'all', label: 'All', icon: 'sparkle' },
              { id: 'food', label: 'Food', icon: 'fork' },
              { id: 'attraction', label: 'Sights', icon: 'camera' },
              { id: 'lodging', label: 'Stay', icon: 'bed' },
              { id: 'transport', label: 'Travel', icon: 'train' },
              { id: 'other', label: 'Other', icon: 'pin' },
            ].map(t => (
              <button key={t.id} className={`place-tab ${placeFilter === t.id ? 'active' : ''}`}
                      onClick={() => setPlaceFilter(t.id)}>
                <Icon name={t.icon} style={{ width: 12, height: 12 }} />
                {t.label} <span className="pill">{counts[t.id] || 0}</span>
              </button>
            ))}
          </div>
          <div className="place-list">
            {visible.length === 0 ? (
              <div className="place-empty">
                {placeFilter === 'all' ? 'No places saved yet. Add a food spot, attraction, or stay below ↓'
                  : `No ${KIND_META[placeFilter]?.plural?.toLowerCase()} yet.`}
              </div>
            ) : (
              visible.map(p => (
                <PlaceRow key={p.id} place={p}
                  onSave={(patch) => onUpdatePlace(p.id, patch)}
                  onDelete={() => onDeletePlace(p.id)}
                  onShowImage={onShowImage}
                  editMode={editMode} />
              ))
            )}
          </div>
          {editMode && <AddPlaceForm onAdd={(p) => onAddPlace(p)} />}
        </div>
          </>
        )}
      </main>
    );
  }
  /* ---------- Day card / Itinerary ---------- */
  function DayCard({ day, index, open, onToggle, onUpdate, onDelete, onAddItem, onUpdateItem, onDeleteItem, onReorderItems, onDragOver, onShowImage, editMode }) {
    const [editingHead, setEditingHead] = useState(false);
    const [adding, setAdding] = useState(false);
    const [editingId, setEditingId] = useState(null);
    const [isDragOver, setIsDragOver] = useState(false);
    const dragRef = useRef(null);

    /* Day-level drag handlers (reorder days) */
    const handleDragStart = (e) => {
      e.dataTransfer.setData('dayId', day.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => dragRef.current?.classList.add('dragging'), 0);
    };
    const handleDragEnd = () => { dragRef.current?.classList.remove('dragging'); setIsDragOver(false); };
    const handleDragOver = (e) => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      setIsDragOver(true);
    };
    const handleDragLeave = () => setIsDragOver(false);
    const handleDrop = (e) => {
      e.preventDefault(); setIsDragOver(false);
      const fromId = e.dataTransfer.getData('dayId');
      if (fromId && fromId !== day.id) onDragOver(fromId);
    };

    return (
      <div ref={dragRef} className={`day-card${isDragOver ? ' drag-over' : ''}`}
           onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>
        <div className="day-head">
          <div className="day-title">
            {/* Drag handle for day */}
            {editMode && (
            <div className="drag-handle" draggable
                 onDragStart={handleDragStart} onDragEnd={handleDragEnd}
                 title="Drag to reorder days">
              <Icon name="grip" />
            </div>
            )}
            <div className="day-num">{index}</div>
            {editingHead ? (
              <DayHeadEdit day={day} onSave={(patch) => { onUpdate(patch); setEditingHead(false); }} onCancel={() => setEditingHead(false)} />
            ) : (
              <button className={`toggle-btn ${open ? 'open' : ''}`} onClick={onToggle}
                      style={{ textAlign: 'left' }}>
                <svg className="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18l6-6-6-6"/></svg>
                <div className="day-info">
                  <div className="d-date">{fmtDayHeader(day.date)}</div>
                  {day.label && <div className="d-label" style={{ fontWeight: 400 }}>{day.label} · {day.items.length} activities</div>}
                  {!day.label && <div className="d-label" style={{ fontWeight: 400 }}>{day.items.length} activities</div>}
                </div>
              </button>
            )}
          </div>
          {!editingHead && editMode && (
            <div className="day-actions">
              <button className="btn icon ghost" onClick={() => setEditingHead(true)} title="Edit day">
                <Icon name="edit" style={{ width: 14, height: 14 }} />
              </button>
              <button className="btn icon ghost danger" onClick={onDelete} title="Delete day">
                <Icon name="trash" style={{ width: 14, height: 14 }} />
              </button>
            </div>
          )}
        </div>
        {open && (
        <div className="timeline">
          {day.items.length === 0 && !adding ? (
            <div className="timeline-empty">No activities scheduled · add one below</div>
          ) : (
            day.items.map(item =>
              editingId === item.id ? (
                <ItemEdit key={item.id} item={item}
                  onSave={(patch) => { onUpdateItem(item.id, patch); setEditingId(null); }}
                  onCancel={() => setEditingId(null)} />
              ) : (
                <TimelineItem key={item.id} item={item}
                  onEdit={() => setEditingId(item.id)}
                  onDelete={() => onDeleteItem(item.id)}
                  onReorder={(fromId) => onReorderItems(fromId, item.id)}
                  onShowImage={onShowImage}
                  onUpdatePhoto={(img) => onUpdateItem(item.id, { ...item, image: img })}
                  onToggleDone={() => onUpdateItem(item.id, { ...item, done: !item.done })}
                  editMode={editMode} />
              )
            )
          )}
          {adding && (
            <ItemEdit
              item={{ time: '', duration: '', title: '', location: '', notes: '', image: '' }}
              onSave={(patch) => { onAddItem(patch); setAdding(false); }}
              onCancel={() => setAdding(false)}
              isNew
            />
          )}
          {!adding && editMode && (
            <button className="btn sm" style={{ marginTop: 10 }} onClick={() => setAdding(true)}>
              <Icon name="plus" style={{ width: 12, height: 12 }} /> Add activity
            </button>
          )}
          <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px dashed var(--line)' }}>
            <label style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--muted)', fontWeight: 600, display: 'block', marginBottom: 5 }}>
              End-of-day reminder
            </label>
            <textarea className="textarea" rows="2"
                      placeholder="e.g. Charge power bank, set alarm 6am, pack camera…"
                      value={day.notes || ''}
                      readOnly={!editMode}
                      onChange={(e) => editMode && onUpdate({ notes: e.target.value })} />
          </div>
        </div>
        )}
      </div>
    );
  }

  function DayHeadEdit({ day, onSave, onCancel }) {
    const [date, setDate] = useState(day.date || '');
    const [label, setLabel] = useState(day.label || '');
    return (
      <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexWrap: 'wrap' }}>
        <input type="date" className="input" style={{ width: 160 }} value={date} onChange={(e) => setDate(e.target.value)} />
        <input className="input" style={{ width: 200 }} placeholder="Day label (optional)" value={label} onChange={(e) => setLabel(e.target.value)} />
        <button className="btn primary sm" onClick={() => onSave({ date, label })}>
          <Icon name="check" style={{ width: 12, height: 12 }} /> Save
        </button>
        <button className="btn ghost sm" onClick={onCancel}>Cancel</button>
      </div>
    );
  }

  function TimelineItem({ item, onEdit, onDelete, onReorder, onShowImage, onUpdatePhoto, onToggleDone, editMode }) {
    const [isDragOver, setIsDragOver] = useState(false);
    const dragRef = useRef(null);
    const photoInputRef = useRef(null);

    const handleDragStart = (e) => {
      e.dataTransfer.setData('itemId', item.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => dragRef.current?.classList.add('dragging'), 0);
    };
    const handleDragEnd = () => { dragRef.current?.classList.remove('dragging'); setIsDragOver(false); };
    const handleDragOver = (e) => {
      if (!e.dataTransfer.types.includes('itemid')) return;
      e.preventDefault(); e.dataTransfer.dropEffect = 'move'; setIsDragOver(true);
    };
    const handleDragLeave = () => setIsDragOver(false);
    const handleDrop = (e) => {
      e.preventDefault(); setIsDragOver(false);
      const fromId = e.dataTransfer.getData('itemId');
      if (fromId && fromId !== item.id) onReorder(fromId);
    };

    const handlePhotoUpload = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const data = await fileToDataURL(file, 800);
        onUpdatePhoto(data);
      } catch (err) { console.warn('Photo upload failed', err); }
      e.target.value = '';
    };

    return (
      <div ref={dragRef} className={`timeline-item${isDragOver ? ' drag-over' : ''}${item.done ? ' ti-done' : ''}${editMode ? ' editing-mode' : ''}`}
           onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>
        {/* Checkbox — always col 1 */}
        <label className="ti-checkbox" title={item.done ? 'Mark as not done' : 'Mark as done'}>
          <input type="checkbox" checked={!!item.done} onChange={() => onToggleDone && onToggleDone()} />
          <span className="ti-checkmark">
            {item.done && (
              <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.2"
                   strokeLinecap="round" strokeLinejoin="round">
                <polyline points="2,6 5,9 10,3" />
              </svg>
            )}
          </span>
        </label>
        {/* Drag handle — only visible in edit mode */}
        {editMode && (
          <div className="drag-handle" draggable style={{ alignSelf: 'center', flexShrink: 0 }}
               onDragStart={handleDragStart} onDragEnd={handleDragEnd} title="Drag to reorder">
            <Icon name="grip" />
          </div>
        )}
        {/* Time pill */}
        <div className="ti-time">
          {formatTime24(item.time)}
          {item.duration && <span className="dur">{item.duration}</span>}
        </div>
        {/* Photo thumbnail (if any) */}
        {item.image && (
          <div className="ti-photo" style={{ backgroundImage: `url(${item.image})` }}
               onClick={() => onShowImage && onShowImage(item.image)} title="Click to enlarge" />
        )}
        {/* Body: title + place + notes */}
        <div className="ti-body">
          <div className="ti-header-row">
            <div className="ti-title">{item.title || '(untitled)'}</div>
            <div className="ti-actions-inline">
              {item.location && <MapPicker placeOrItem={item} label="Map" />}
              {editMode && <>
                <button className="btn icon ghost" onClick={() => onEdit()} title="Edit">
                  <Icon name="edit" style={{ width: 13, height: 13 }} />
                </button>
                <button className="btn icon ghost" style={{ color: 'var(--danger)' }} onClick={onDelete} title="Delete">
                  <Icon name="trash" style={{ width: 13, height: 13 }} />
                </button>
              </>}
            </div>
          </div>
          {item.location && (
            <div className="ti-place"><Icon name="pin" />{item.location}</div>
          )}
          {item.notes && <div className="ti-notes">{item.notes}</div>}
          {!item.image && editMode && (
            <label className="ti-photo-upload" title="Add a photo">
              <Icon name="camera" /><span>Add photo</span>
              <input ref={photoInputRef} type="file" accept="image/*" onChange={handlePhotoUpload} />
            </label>
          )}
        </div>
      </div>
    );
  }

  function ItemEdit({ item, onSave, onCancel, isNew }) {
    const [draft, setDraft] = useState({ image: '', ...item });

    const handlePhotoChange = async (e) => {
      const file = e.target.files[0]; if (!file) return;
      try { const d = await fileToDataURL(file, 800); setDraft(p => ({ ...p, image: d })); }
      catch (err) { console.warn(err); }
      e.target.value = '';
    };

    return (
      <div className="ti-edit">
        <div className="ti-time" style={{ alignSelf: 'start' }}>
          <input type="time" value={draft.time || ''} className="input" style={{ padding: '4px 6px', fontSize: 12 }}
                 onChange={(e) => setDraft({ ...draft, time: e.target.value })}
                 step="60" />
        </div>
        <div className="ti-edit-form">
          <input className="input" placeholder="Activity title (e.g. Visit temple)"
                 value={draft.title} autoFocus
                 onChange={(e) => setDraft({ ...draft, title: e.target.value })} />
          <input className="input" placeholder="Duration (e.g. 2h)" value={draft.duration || ''}
                 onChange={(e) => setDraft({ ...draft, duration: e.target.value })} />
          <input className="input span2" placeholder="Place / location (used for Google Maps &amp; Amap link)"
                 value={draft.location || ''}
                 onChange={(e) => setDraft({ ...draft, location: e.target.value })} />
          <textarea className="textarea span2" rows="2" placeholder="Notes"
                    value={draft.notes || ''}
                    onChange={(e) => setDraft({ ...draft, notes: e.target.value })} />
          {/* Photo row */}
          <div className="item-photo-row">
            <div className="item-photo-preview"
                 style={{ backgroundImage: draft.image ? `url(${draft.image})` : 'none', backgroundSize: 'cover', backgroundPosition: 'center' }}>
              {!draft.image && <Icon name="image" />}
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
              <label className="ti-photo-upload">
                <Icon name="camera" />{draft.image ? 'Replace photo' : 'Add photo hint'}
                <input type="file" accept="image/*" onChange={handlePhotoChange} />
              </label>
              {draft.image && (
                <button type="button" className="btn ghost sm" style={{ fontSize: 11, padding: '3px 8px' }}
                        onClick={() => setDraft(p => ({ ...p, image: '' }))}>
                  <Icon name="x" style={{ width: 10, height: 10 }} /> Remove
                </button>
              )}
            </div>
          </div>
          <div className="span2" style={{ display: 'flex', justifyContent: 'flex-end', gap: 6 }}>
            <button className="btn ghost sm" onClick={onCancel}>Cancel</button>
            <button className="btn primary sm" onClick={() => onSave(draft)}>
              <Icon name="check" style={{ width: 12, height: 12 }} /> {isNew ? 'Add activity' : 'Save'}
            </button>
          </div>
        </div>
      </div>
    );
  }

  function AddDayInline({ tripStart, tripEnd, existing, onAdd }) {
    const suggestNext = () => {
      if (!tripStart) return '';
      const sorted = [...existing].filter(Boolean).sort();
      const last = sorted[sorted.length - 1];
      const base = last ? new Date(last) : new Date(tripStart);
      if (last) base.setDate(base.getDate() + 1);
      return base.toISOString().slice(0, 10);
    };
    const [date, setDate] = useState('');
    useEffect(() => { setDate(suggestNext()); /* eslint-disable-next-line */ }, [tripStart, existing.length]);
    return (
      <div style={{ display: 'flex', gap: 8, marginTop: 12, alignItems: 'center', flexWrap: 'wrap' }}>
        <input type="date" className="input" style={{ width: 180 }} value={date}
               min={tripStart || undefined} max={tripEnd || undefined}
               onChange={(e) => setDate(e.target.value)} />
        <button className="btn" onClick={() => { if (date) onAdd(date); }}>
          <Icon name="plus" style={{ width: 12, height: 12 }} /> Add day
        </button>
      </div>
    );
  }

  /* ---------- Place row ---------- */
  function PlaceRow({ place, onSave, onDelete, onShowImage, editMode }) {
    const [editing, setEditing] = useState(false);
    const [draft, setDraft] = useState(place);

    useEffect(() => { setDraft(place); }, [place.id]);

    const handleImageChange = async (file) => {
      if (!file) return;
      try {
        const data = await fileToDataURL(file);
        setDraft(d => ({ ...d, image: data }));
      } catch (e) { alert('Failed to read image'); }
    };

    if (editing) {
      const save = () => {
        onSave({
          name: draft.name.trim() || 'Untitled place',
          address: draft.address.trim(),
          city: (draft.city || '').trim(),
          notes: draft.notes,
          kind: draft.kind,
          image: draft.image || '',
        });
        setEditing(false);
      };
      return (
        <div className={`place editing ${draft.kind}`}>
          <div className="badge"><Icon name={KIND_META[draft.kind]?.icon || 'pin'} /></div>
          <div className="place-thumb has-img" style={{ backgroundImage: draft.image ? `url(${draft.image})` : 'none' }}>
            {!draft.image && <Icon name="image" />}
          </div>
          <div className="place-edit-grid" style={{ gridColumn: '3 / span 2' }}>
            <input className="input" placeholder="Place name" value={draft.name}
              onChange={(e) => setDraft({ ...draft, name: e.target.value })} autoFocus />
            <select className="select" value={draft.kind}
              onChange={(e) => setDraft({ ...draft, kind: e.target.value })}>
              {Object.entries(KIND_META).map(([k, m]) => (
                <option key={k} value={k}>{m.plural}</option>
              ))}
            </select>
            <input className="input" placeholder="City (e.g. Hong Kong)" value={draft.city || ''}
              onChange={(e) => setDraft({ ...draft, city: e.target.value })} />
            <input className="input" placeholder="Address or area" value={draft.address}
              onChange={(e) => setDraft({ ...draft, address: e.target.value })} />
            <input className="input" placeholder="(legacy)" style={{ display: 'none' }} />
            <textarea className="textarea" rows="2" placeholder="Notes"
              style={{ gridColumn: '1 / span 2' }} value={draft.notes}
              onChange={(e) => setDraft({ ...draft, notes: e.target.value })} />
            <div style={{ gridColumn: '1 / span 2' }}>
              <ImageUploader image={draft.image}
                onChange={handleImageChange}
                onClear={() => setDraft(d => ({ ...d, image: '' }))} />
            </div>
            <div style={{ display: 'flex', gap: 8, gridColumn: '1 / span 2', justifyContent: 'flex-end' }}>
              <button className="btn ghost sm" onClick={() => { setDraft(place); setEditing(false); }}>Cancel</button>
              <button className="btn primary sm" onClick={save}>
                <Icon name="check" style={{ width: 12, height: 12 }} /> Save
              </button>
            </div>
          </div>
        </div>
      );
    }

    return (
      <div className={`place ${place.kind}`}>
        <div className="badge" title={KIND_META[place.kind]?.label}>
          <Icon name={KIND_META[place.kind]?.icon || 'pin'} />
        </div>
        <div className={`place-thumb ${place.image ? 'has-img' : ''}`}
             style={{ backgroundImage: place.image ? `url(${place.image})` : 'none', cursor: place.image ? 'zoom-in' : 'default' }}
             onClick={() => place.image && onShowImage(place.image)}
             title={place.image ? 'Click to enlarge' : 'No photo'}>
          {!place.image && <Icon name="image" />}
        </div>
        <div className="place-body">
          <div className="place-name">
            {place.name || 'Untitled place'}
            {place.city && <span className="pill" style={{ marginLeft: 8, fontSize: 10 }}>{place.city}</span>}
          </div>
          {place.address && (
            <div className="place-addr">
              <Icon name="pin" style={{ width: 11, height: 11 }} />
              {place.address}
            </div>
          )}
          {place.notes && <div className="place-note">{place.notes}</div>}
        </div>
        <div className="place-actions">
          <MapPicker placeOrItem={place} label="Maps" />
          {editMode && <>
            <button className="btn icon ghost" onClick={() => setEditing(true)} title="Edit">
              <Icon name="edit" style={{ width: 14, height: 14 }} />
            </button>
            <button className="btn icon ghost" style={{ color: 'var(--danger)' }} onClick={onDelete} title="Delete">
              <Icon name="trash" style={{ width: 14, height: 14 }} />
            </button>
          </>}
        </div>
      </div>
    );
  }

  function ImageUploader({ image, onChange, onClear }) {
    const inputRef = useRef(null);
    return (
      <div className="img-uploader">
        <div className="img-preview" style={{ backgroundImage: image ? `url(${image})` : 'none' }}>
          {!image && <Icon name="image" style={{ width: 22, height: 22 }} />}
        </div>
        <div className="img-uploader-actions">
          <label className="file-button">
            <Icon name="upload" style={{ width: 12, height: 12 }} />
            {image ? 'Replace photo' : 'Upload photo'}
            <input ref={inputRef} type="file" accept="image/*"
                   onChange={(e) => { onChange(e.target.files[0]); e.target.value = ''; }} />
          </label>
          {image && (
            <button type="button" className="btn ghost sm" style={{ alignSelf: 'flex-start' }} onClick={onClear}>
              <Icon name="x" style={{ width: 12, height: 12 }} /> Remove photo
            </button>
          )}
          <span className="muted" style={{ fontSize: 11 }}>JPG/PNG · resized to 1400px</span>
        </div>
      </div>
    );
  }

  /* ---------- Map picker dropdown ---------- */
  function MapPicker({ placeOrItem, label = 'Maps' }) {
    const [open, setOpen] = useState(false);
    const ref = useRef(null);

    useEffect(() => {
      if (!open) return;
      const close = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
      document.addEventListener('mousedown', close);
      return () => document.removeEventListener('mousedown', close);
    }, [open]);

    return (
      <div className="map-picker" ref={ref}>
        <button className="map-picker-btn" onClick={() => setOpen(o => !o)}
                title="Open map">
          <Icon name="map" />
          {label}
          <svg className="map-picker-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 9l6 6 6-6" />
          </svg>
        </button>
        {open && (
          <div className="map-picker-menu" onClick={() => setOpen(false)}>
            <a className="mp-google" href={mapsUrl(placeOrItem)}
               target="_blank" rel="noopener noreferrer">
              <span className="mp-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
                     strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
              </span>
              <span>
                Google Maps
                <span className="mp-sub">maps.google.com</span>
              </span>
            </a>
            <a className="mp-amap" href={amapUrl(placeOrItem)}
               target="_blank" rel="noopener noreferrer">
              <span className="mp-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"
                     strokeLinecap="round" strokeLinejoin="round">
                  <path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/>
                </svg>
              </span>
              <span>
                高德地图 Amap
                <span className="mp-sub">amap.com · opens app on mobile</span>
              </span>
            </a>
          </div>
        )}
      </div>
    );
  }

  /* ---------- Add place form ---------- */
  function AddPlaceForm({ onAdd }) {
    const [open, setOpen] = useState(false);
    const [name, setName] = useState('');
    const [city, setCity] = useState('');
    const [address, setAddress] = useState('');
    const [kind, setKind] = useState('food');
    const [notes, setNotes] = useState('');
    const [image, setImage] = useState('');
    const nameRef = useRef(null);

    useEffect(() => { if (open) nameRef.current?.focus(); }, [open]);

    const submit = (e) => {
      e?.preventDefault();
      if (!name.trim()) return;
      onAdd({ name: name.trim(), city: city.trim(), address: address.trim(), kind, notes, image });
      setName(''); setCity(''); setAddress(''); setNotes(''); setImage(''); setKind('food');
      nameRef.current?.focus();
    };

    if (!open) {
      return (
        <button className="btn" style={{ marginTop: 12, width: '100%', justifyContent: 'center' }}
                onClick={() => setOpen(true)}>
          <Icon name="plus" style={{ width: 14, height: 14 }} /> Add a place
        </button>
      );
    }

    return (
      <form className="add-place-form" onSubmit={submit}>
        <div className="row between">
          <strong style={{ fontSize: 13 }}>Add place</strong>
          <button type="button" className="btn ghost sm" onClick={() => setOpen(false)}>
            <Icon name="x" style={{ width: 12, height: 12 }} /> Close
          </button>
        </div>
        <div className="add-place-row">
          <input ref={nameRef} className="input" placeholder="Name (e.g. Wong Tai Sin Temple)" value={name}
                 onChange={(e) => setName(e.target.value)} />
          <input className="input" placeholder="City (e.g. Hong Kong)" value={city}
                 onChange={(e) => setCity(e.target.value)} />
          <select className="select" value={kind} onChange={(e) => setKind(e.target.value)}>
            {Object.entries(KIND_META).map(([k, m]) => (
              <option key={k} value={k}>{m.plural}</option>
            ))}
          </select>
        </div>
        <input className="input" placeholder="Address or area" value={address}
               onChange={(e) => setAddress(e.target.value)} />
        <textarea className="textarea" rows="2" placeholder="Notes (optional)"
                  value={notes} onChange={(e) => setNotes(e.target.value)} />
        <ImageUploader image={image}
          onChange={async (file) => { if (file) setImage(await fileToDataURL(file)); }}
          onClear={() => setImage('')} />
        <div className="row" style={{ justifyContent: 'space-between' }}>
          <span className="muted" style={{ fontSize: 12 }}>Tip: address powers the Google Maps &amp; Amap links.</span>
          <div className="row">
            <button type="button" className="btn ghost sm"
                    onClick={() => { setName(''); setAddress(''); setNotes(''); setImage(''); }}>Clear</button>
            <button type="submit" className="btn primary sm" disabled={!name.trim()}>
              <Icon name="plus" style={{ width: 12, height: 12 }} /> Add place
            </button>
          </div>
        </div>
      </form>
    );
  }

  /* ---------- New trip modal ---------- */
  function NewTripModal({ onClose, onCreate }) {
    const [data, setData] = useState({ title: '', destination: '', origin: '', startDate: '', endDate: '', travelers: 1 });
    const inputRef = useRef(null);
    useEffect(() => { inputRef.current?.focus(); }, []);
    useEffect(() => {
      const k = (e) => { if (e.key === 'Escape') onClose(); };
      window.addEventListener('keydown', k);
      return () => window.removeEventListener('keydown', k);
    }, [onClose]);

    const valid = data.title.trim().length > 0;

    return (
      <div className="modal-backdrop" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
        <div className="modal">
          <div className="modal-head">
            <h3>New trip</h3>
            <button className="btn ghost icon" onClick={onClose}>
              <Icon name="x" style={{ width: 14, height: 14 }} />
            </button>
          </div>
          <div className="modal-body">
            <div className="field">
              <label>Trip title</label>
              <input ref={inputRef} className="input" placeholder="e.g. Hong Kong & Shenzhen"
                value={data.title} onChange={(e) => setData({ ...data, title: e.target.value })}
                onKeyDown={(e) => { if (e.key === 'Enter' && valid) onCreate(data); }} />
            </div>
            <div className="grid-2">
              <div className="field">
                <label>From</label>
                <input className="input" placeholder="Bangkok, Thailand"
                  value={data.origin} onChange={(e) => setData({ ...data, origin: e.target.value })} />
              </div>
              <div className="field">
                <label>To</label>
                <input className="input" placeholder="Hong Kong"
                  value={data.destination} onChange={(e) => setData({ ...data, destination: e.target.value })} />
              </div>
            </div>
            <div className="grid-2">
              <div className="field">
                <label>Start date</label>
                <input className="input" type="date" value={data.startDate}
                  onChange={(e) => setData({ ...data, startDate: e.target.value })} />
              </div>
              <div className="field">
                <label>End date</label>
                <input className="input" type="date" value={data.endDate}
                  onChange={(e) => setData({ ...data, endDate: e.target.value })} />
              </div>
            </div>
            <div className="field">
              <label>Travelers</label>
              <input className="input" type="number" min="1" value={data.travelers}
                onChange={(e) => setData({ ...data, travelers: Math.max(1, Number(e.target.value) || 1) })} />
            </div>
          </div>
          <div className="modal-foot">
            <button className="btn ghost" onClick={onClose}>Cancel</button>
            <button className="btn primary" disabled={!valid} onClick={() => onCreate(data)}>
              <Icon name="check" style={{ width: 12, height: 12 }} /> Create trip
            </button>
          </div>
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
