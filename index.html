<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#f6f1e8" id="theme-meta"/>
<title>Travel Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#f6f1e8;--bg2:#ede7d8;--paper:#fbf7ef;
  --ink:#1f1b16;--ink2:#4a4239;--muted:#8a7f70;
  --line:#e3d9c6;--lines:#c9bda4;
  --accent:oklch(62% 0.14 45);--accent-ink:oklch(38% 0.10 45);--accent-bg:oklch(95% 0.03 75);
  --leaf:oklch(55% 0.10 150);--leaf-bg:oklch(94% 0.04 150);
  --sky:oklch(55% 0.12 240);--sky-bg:oklch(94% 0.04 240);
  --danger:oklch(55% 0.18 25);--danger-bg:oklch(96% 0.03 25);
  --nav:68px;--safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
  --r:16px;--r-sm:10px;--r-xs:8px;
  --shadow:0 1px 0 rgba(31,27,22,.04),0 4px 16px -6px rgba(31,27,22,.14);
  --shadow-lg:0 8px 32px -8px rgba(31,27,22,.22);
}
[data-theme=dark]{
  --bg:#1a1510;--bg2:#231e17;--paper:#201b14;
  --ink:#f0e8d8;--ink2:#c4b8a4;--muted:#7a7060;
  --line:#332c22;--lines:#4a4030;
  --accent:oklch(68% 0.16 48);--accent-ink:oklch(80% 0.12 55);--accent-bg:oklch(22% 0.06 45);
  --leaf:oklch(62% 0.12 150);--leaf-bg:oklch(20% 0.05 150);
  --sky:oklch(62% 0.13 240);--sky-bg:oklch(20% 0.05 240);
  --danger:oklch(62% 0.20 25);--danger-bg:oklch(18% 0.04 25);
  --shadow:0 1px 0 rgba(0,0,0,.2),0 4px 16px -6px rgba(0,0,0,.45);
  --shadow-lg:0 8px 32px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;border:none;background:none;padding:0;}
input,textarea,select{font-family:inherit;color:inherit;}
::-webkit-scrollbar{display:none;}*{scrollbar-width:none;}
input[type=time]::-webkit-datetime-edit-ampm-field{display:none;}
input[type=time]{-webkit-appearance:none;}

/* ── App shell ── */
#root{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  background:var(--bg);overflow:hidden;
  transition:transform .3s cubic-bezier(.32,.72,0,1);
  will-change:transform;
}
.screen.slide-in{transform:translateX(0)!important;}
.screen.slide-out{transform:translateX(-30%)!important;}
.screen-forward{transform:translateX(100%);}
.screen-back{transform:translateX(0);}

/* ── Bottom nav ── */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;align-items:stretch;
  padding-bottom:var(--safe-bottom);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;padding:10px 4px 8px;
  color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.03em;
  transition:color .15s;cursor:pointer;position:relative;
}
.nav-item.active{color:var(--accent);}
.nav-item svg{width:22px;height:22px;}
.nav-dot{
  position:absolute;top:8px;right:calc(50% - 16px);
  width:6px;height:6px;border-radius:50%;background:var(--accent);
  opacity:0;transition:opacity .15s;
}
.nav-item.active .nav-dot{opacity:1;}

/* ── Scrollable content ── */
.scroll-view{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  padding-bottom:calc(var(--nav) + var(--safe-bottom) + 16px);
}

/* ── Top bars ── */
.top-bar{
  display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-top) + 14px) 18px 12px;
  background:var(--paper);border-bottom:1px solid var(--line);
  flex-shrink:0;position:relative;z-index:10;
}
.top-bar-title{
  flex:1;font-family:'Fraunces',serif;font-size:19px;font-weight:600;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  min-width:0;
}
.top-bar-sub{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600;}
.back-btn{
  width:36px;height:36px;border-radius:50%;background:var(--bg2);
  display:grid;place-items:center;color:var(--ink2);flex-shrink:0;
  border:1px solid var(--line);
}
.back-btn svg{width:18px;height:18px;}
.icon-btn{
  width:36px;height:36px;border-radius:var(--r-xs);
  display:grid;place-items:center;color:var(--ink2);
  background:var(--bg2);border:1px solid var(--line);flex-shrink:0;
  transition:background .12s;
}
.icon-btn:active{background:var(--lines);}
.icon-btn svg{width:18px;height:18px;}
.icon-btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}

/* ── Buttons ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1.5px solid var(--lines);background:var(--paper);color:var(--ink);
  border-radius:var(--r-sm);padding:10px 16px;
  font-size:14px;font-weight:600;font-family:inherit;
  transition:transform .08s,background .12s,border-color .12s;
  cursor:pointer;
}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn.accent{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink2);}
.btn.danger{color:var(--danger);border-color:var(--danger);background:var(--danger-bg);}
.btn.sm{padding:7px 12px;font-size:13px;}
.btn.full{width:100%;justify-content:center;}
.btn svg{width:16px;height:16px;}
.btn[disabled]{opacity:.45;cursor:not-allowed;}

/* ── Forms ── */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;}
.input,.textarea,.select{
  background:var(--bg2);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:11px 14px;font-size:15px;
  color:var(--ink);width:100%;transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none;appearance:none;
}
.input:focus,.textarea:focus,.select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg);
}
.textarea{resize:vertical;min-height:72px;line-height:1.5;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ── Trip cards (trips screen) ── */
.trip-card{
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r);padding:16px;margin:0 16px 12px;
  display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  cursor:pointer;transition:transform .1s,box-shadow .1s;
  -webkit-tap-highlight-color:transparent;
}
.trip-card:active{transform:scale(.985);box-shadow:none;}
.tc-bar{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);}
.tc-flag{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:var(--accent-bg);color:var(--accent-ink);
  display:grid;place-items:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:20px;
}
.tc-body{min-width:0;flex:1;}
.tc-title{font-weight:700;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tc-meta{font-size:12px;color:var(--muted);margin-top:3px;}
.tc-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.chip{
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;
  background:var(--bg2);color:var(--ink2);border:1px solid var(--line);
}
.chip.accent{background:var(--accent-bg);color:var(--accent-ink);border-color:transparent;}
.chip svg{width:10px;height:10px;}

/* ── Empty state ── */
.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:48px 32px;text-align:center;gap:12px;
}
.empty-state svg{width:52px;height:52px;color:var(--muted);opacity:.5;}
.empty-title{font-family:'Fraunces',serif;font-size:24px;color:var(--ink);}
.empty-sub{font-size:14px;color:var(--muted);line-height:1.5;max-width:260px;}

/* ── FAB ── */
.fab{
  position:fixed;right:20px;
  bottom:calc(var(--nav) + var(--safe-bottom) + 16px);
  width:56px;height:56px;border-radius:18px;
  background:var(--accent);color:#fff;
  display:grid;place-items:center;
  box-shadow:0 8px 24px -4px oklch(62% 0.14 45 / .5);
  z-index:50;transition:transform .12s,box-shadow .12s;
  border:none;cursor:pointer;
}
.fab:active{transform:scale(.9);}
.fab svg{width:24px;height:24px;}
@media(min-width:640px){.fab{right:calc(50% - 300px);}}

/* ── Detail screen hero — collapsing ── */
.detail-hero{
  background:radial-gradient(120% 80% at 100% 0%,var(--accent-bg) 0%,transparent 55%),var(--paper);
  padding:20px 20px 18px;border-bottom:1px solid var(--line);
  /* anchor for IntersectionObserver — scroll this off screen to trigger compact bar */
}
.detail-hero h1{
  font-family:'Fraunces',serif;font-size:28px;font-weight:600;
  letter-spacing:-.025em;line-height:1.1;margin:0 0 12px;
}
.meta-chips{display:flex;gap:6px;flex-wrap:wrap;}

/* ── Compact top bar when hero is scrolled away ── */
.detail-top-bar{
  display:flex;align-items:center;gap:8px;
  padding:calc(var(--safe-top) + 12px) 16px 10px;
  background:var(--paper);border-bottom:1px solid var(--line);
  flex-shrink:0;position:relative;z-index:10;
  transition:background .2s;
}
.detail-top-bar.scrolled{
  background:var(--paper);
  box-shadow:0 1px 0 var(--line),0 4px 12px -4px rgba(31,27,22,.1);
}
/* compact title: hidden by default, shown when scrolled */
.detail-compact-title{
  flex:1;min-width:0;overflow:hidden;
  transition:opacity .2s,transform .2s;
}
.detail-compact-title .cct-main{
  font-family:'Fraunces',serif;font-size:16px;font-weight:700;
  letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--ink);line-height:1.1;
  opacity:0;transform:translateY(6px);
  transition:opacity .22s,transform .22s;
}
.detail-compact-title .cct-sub{
  font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;
  font-weight:600;margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  opacity:0;transform:translateY(4px);
  transition:opacity .22s .04s,transform .22s .04s;
}
.detail-top-bar.scrolled .cct-main,
.detail-top-bar.scrolled .cct-sub{
  opacity:1;transform:none;
}

/* ── Section tabs (like an iOS segmented control) ── */
.seg-tabs{
  display:flex;background:var(--bg2);padding:4px;
  border-radius:12px;margin:12px 16px 12px;
  border:1px solid var(--line);overflow-x:auto;gap:2px;
  scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.seg-tabs::-webkit-scrollbar{display:none;}
.seg-tab{
  flex:1;min-width:fit-content;padding:8px 14px;border-radius:9px;
  font-size:13px;font-weight:600;color:var(--muted);
  transition:background .15s,color .15s;white-space:nowrap;cursor:pointer;
  text-align:center;border:none;background:transparent;font-family:inherit;
}
.seg-tab.active{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);}

/* ── Day cards ── */
.day-card{
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r);margin:0 14px 12px;overflow:hidden;
  box-shadow:var(--shadow);
}
.day-card.drag-over{outline:2.5px dashed var(--accent);outline-offset:2px;}
.day-card.dragging{opacity:.4;}
.day-head{
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
.day-num{
  width:32px;height:32px;border-radius:9px;flex-shrink:0;
  background:var(--ink);color:var(--bg);
  display:grid;place-items:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:15px;
}
.day-info{flex:1;min-width:0;}
.day-date{font-weight:700;font-size:14px;color:var(--ink);}
.day-label{font-size:12px;color:var(--muted);margin-top:1px;}
.day-toggle{
  width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  background:transparent;color:var(--muted);border:1px solid var(--line);
  flex-shrink:0;cursor:pointer;
}
.day-toggle svg{width:16px;height:16px;transition:transform .18s;}
.day-toggle.open svg{transform:rotate(90deg);}
.day-actions{display:flex;gap:4px;}

/* ── Timeline items ── */
.timeline{padding:4px 14px 14px;}
.tl-item{
  /* Row 1: [check] [drag] [time] [photo?] [body]     */
  /* Row 2 (inside .ti-body): title, place, notes, actions */
  display:flex;align-items:flex-start;gap:8px;
  padding:13px 0;border-top:1px dashed var(--line);
  min-width:0;
}
.tl-item:first-child{border-top:none;padding-top:14px;}
.tl-item.ti-done .ti-time{opacity:.4;text-decoration:line-through;}
.tl-item.ti-done .ti-title{opacity:.45;text-decoration:line-through;}
.tl-item.ti-done .ti-place,.tl-item.ti-done .ti-notes{opacity:.35;}
.tl-item.drag-over{border-top:2px solid var(--accent);}
.tl-item.dragging{opacity:.4;}

/* checkbox */
.ti-check{
  width:22px;height:22px;border-radius:6px;flex-shrink:0;
  border:2px solid var(--lines);background:var(--paper);
  display:grid;place-items:center;
  cursor:pointer;transition:background .15s,border-color .15s;
  margin-top:2px;
}
.ti-check svg{width:11px;height:11px;color:#fff;}
.ti-done .ti-check{background:var(--accent);border-color:var(--accent);}

.drag-handle{
  cursor:grab;color:var(--muted);display:flex;align-items:center;
  flex-shrink:0;opacity:0;transition:opacity .12s;touch-action:none;padding:2px;
  margin-top:1px;
}
.drag-handle:active{cursor:grabbing;}
.drag-handle svg{width:14px;height:14px;}
.tl-item:hover .drag-handle,.day-card:hover .day-drag{opacity:1;}
.day-drag{cursor:grab;color:var(--muted);opacity:0;transition:opacity .12s;}
.day-drag svg{width:14px;height:14px;}

.ti-time{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-bg);border-radius:7px;
  padding:4px 7px;text-align:center;line-height:1.3;
  flex-shrink:0;min-width:46px;align-self:flex-start;
  white-space:nowrap;
}
.ti-dur{display:block;font-size:10px;color:var(--muted);margin-top:1px;font-weight:400;}

/* body takes all remaining width — actions live INSIDE it */
.ti-body{
  flex:1 1 0;min-width:0;
  display:flex;flex-direction:column;
}
.ti-title{
  font-weight:700;font-size:14.5px;color:var(--ink);
  line-height:1.3;word-break:break-word;
}
.ti-place{
  font-size:12px;color:var(--muted);margin-top:3px;
  display:flex;align-items:flex-start;gap:4px;min-width:0;
  word-break:break-word;
}
.ti-place svg{width:10px;height:10px;flex-shrink:0;margin-top:2px;}
.ti-notes{
  font-size:12.5px;color:var(--ink2);margin-top:5px;
  line-height:1.5;white-space:pre-wrap;word-break:break-word;
}
/* action bar — lives under the text, flush left */
.ti-action-bar{
  display:flex;align-items:center;gap:4px;
  margin-top:8px;flex-wrap:wrap;
}
.ti-photo{
  width:64px;height:64px;border-radius:10px;
  background:var(--bg2);background-size:cover;background-position:center;
  border:1px solid var(--line);cursor:zoom-in;
  /* float right INSIDE ti-body — text flows beside it */
  float:right;margin:0 0 6px 10px;flex-shrink:0;
}
/* clear float after ti-body content */
.ti-body::after{content:'';display:table;clear:both;}
/* kept for backwards compat */
.ti-actions{display:none;}

/* ── Activity edit (full-screen sheet) ── */
.edit-sheet{
  position:fixed;inset:0;z-index:200;
  display:flex;flex-direction:column;
  background:var(--bg);
  animation:slideUp .22s cubic-bezier(.32,.72,0,1);
}
.edit-sheet-head{
  padding:calc(var(--safe-top) + 14px) 18px 14px;
  background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
.edit-sheet-title{flex:1;font-family:'Fraunces',serif;font-size:20px;font-weight:600;letter-spacing:-.02em;}
.edit-sheet-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.edit-sheet-foot{
  padding:12px 18px;padding-bottom:calc(12px + var(--safe-bottom));
  background:var(--paper);border-top:1px solid var(--line);
  display:flex;gap:8px;flex-shrink:0;
  box-shadow:0 -4px 16px rgba(0,0,0,.07);
}

/* ── Photo upload small ── */
.photo-upload{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;color:var(--muted);cursor:pointer;
  border:1.5px dashed var(--lines);border-radius:6px;
  padding:4px 9px;margin-top:4px;transition:border-color .12s,color .12s;
}
.photo-upload:hover,.photo-upload:active{color:var(--accent-ink);border-color:var(--accent);}
.photo-upload svg{width:11px;height:11px;}
.photo-upload input{display:none;}

/* ── Places ── */
.place-card{
  background:var(--paper);border:1.5px solid var(--line);
  border-radius:var(--r);padding:14px;margin:0 14px 10px;
  box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;
}
.place-badge{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  display:grid;place-items:center;
}
.place-badge svg{width:18px;height:18px;}
.food .place-badge{background:var(--accent-bg);color:var(--accent-ink);}
.attraction .place-badge{background:var(--leaf-bg);color:var(--leaf);}
.lodging .place-badge{background:#ece4f5;color:#5b3f8e;}
.transport .place-badge{background:var(--sky-bg);color:var(--sky);}
.other .place-badge{background:var(--bg2);color:var(--ink2);}
.place-body{flex:1;min-width:0;}
.place-name{font-weight:700;font-size:15px;color:var(--ink);margin-bottom:2px;}
.place-addr{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;margin-bottom:3px;}
.place-addr svg{width:10px;height:10px;}
.place-note{font-size:13px;color:var(--ink2);line-height:1.45;white-space:pre-wrap;}
.place-thumb{
  width:68px;height:68px;border-radius:10px;flex-shrink:0;
  background-size:cover;background-position:center;background-color:var(--bg2);
  border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);
}
.place-thumb svg{width:20px;height:20px;opacity:.5;}
.place-footer{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.place-city{
  display:inline-block;padding:2px 8px;border-radius:99px;
  font-size:11px;font-weight:600;background:var(--bg2);
  color:var(--ink2);border:1px solid var(--line);
}

/* ── Map picker ── */
.map-picker{position:relative;display:inline-flex;}
.map-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:8px;font-size:12px;font-weight:600;
  border:1px solid var(--lines);background:var(--paper);color:var(--ink2);
  cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap;
}
.map-btn svg{width:13px;height:13px;}
.map-btn:hover,.map-btn:active{background:var(--bg2);border-color:var(--ink2);color:var(--ink);}
.map-menu{
  position:absolute;top:calc(100%+5px);right:0;z-index:200;
  background:var(--paper);border:1.5px solid var(--lines);
  border-radius:12px;box-shadow:var(--shadow-lg);min-width:180px;overflow:hidden;
}
.map-menu a{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  font-size:13px;font-weight:500;color:var(--ink);text-decoration:none;
  transition:background .1s;
}
.map-menu a:hover,.map-menu a:active{background:var(--bg2);}
.map-menu a+a{border-top:1px solid var(--line);}
.mm-ico{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:grid;place-items:center;font-size:13px;}
.mm-ico svg{width:13px;height:13px;}
.mm-google .mm-ico{background:#e8f0fe;color:#1a73e8;}
.mm-amap   .mm-ico{background:#e6f7ec;color:#0fa958;}
.mm-sub{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:1px;}

/* ── Search ── */
.search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg2);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:11px 14px;margin:14px 16px 4px;
  transition:border-color .15s;
}
.search-bar:focus-within{border-color:var(--accent);background:var(--paper);}
.search-bar svg{width:16px;height:16px;color:var(--muted);flex-shrink:0;}
.search-bar input{flex:1;border:none;background:transparent;font-size:14px;color:var(--ink);outline:none;}
.search-bar input::placeholder{color:var(--muted);}

/* ── Filter pills ── */
.filter-row{display:flex;gap:6px;padding:10px 16px 2px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-pill{
  flex-shrink:0;display:inline-flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;
  border:1.5px solid var(--line);background:var(--paper);color:var(--muted);
  cursor:pointer;transition:background .12s,color .12s,border-color .12s;white-space:nowrap;
}
.filter-pill.active{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent);}
.filter-pill svg{width:12px;height:12px;}
.filter-count{
  padding:1px 6px;border-radius:99px;font-size:10px;
  background:var(--bg2);color:var(--muted);margin-left:2px;
}
.filter-pill.active .filter-count{background:var(--accent-bg);color:var(--accent-ink);}

/* ── Trip details section ── */
.trip-info-row{
  display:flex;align-items:center;gap:12px;
  padding:12px 0;border-bottom:1px solid var(--line);
}
.trip-info-row:last-child{border-bottom:none;}
.trip-info-ico{
  width:36px;height:36px;border-radius:10px;flex-shrink:0;
  background:var(--bg2);display:grid;place-items:center;color:var(--muted);
}
.trip-info-ico svg{width:16px;height:16px;}
.trip-info-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;}
.trip-info-val{font-size:14px;font-weight:600;color:var(--ink);}

/* ── Modal (bottom sheet style) ── */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(20,16,10,.5);
  display:flex;align-items:flex-end;z-index:300;
  animation:fadeIn .18s ease;
}
.modal{
  background:var(--paper);border-radius:22px 22px 0 0;
  width:100%;max-height:92dvh;overflow:hidden;
  display:flex;flex-direction:column;
  animation:slideUp .22s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -20px 60px rgba(0,0,0,.2);
  padding-bottom:var(--safe-bottom);
}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--lines);margin:10px auto 0;}
.modal-head{padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
.modal-head h3{margin:0;font-family:'Fraunces',serif;font-size:22px;font-weight:600;letter-spacing:-.02em;}
.modal-body{padding:0 20px 20px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:14px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;}

/* ── Image uploader ── */
.img-uploader{
  border:1.5px dashed var(--lines);background:var(--bg2);
  border-radius:var(--r-sm);padding:12px;
  display:flex;gap:10px;align-items:center;
}
.img-preview{
  width:60px;height:60px;border-radius:8px;flex-shrink:0;
  background:var(--bg);background-size:cover;background-position:center;
  border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);
}
.img-preview svg{width:18px;height:18px;opacity:.4;}

/* ── Toast ── */
.toast-stack{position:fixed;bottom:calc(var(--nav) + var(--safe-bottom) + 12px);left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:90%;max-width:360px;}
.toast{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--ink);color:var(--bg);
  border-radius:12px;padding:12px 16px;
  font-size:13px;font-weight:500;pointer-events:all;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  position:relative;overflow:hidden;animation:toastIn .2s ease;width:100%;
}
.toast-undo{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;}
.toast-progress{position:absolute;bottom:0;left:0;height:3px;background:var(--accent);animation:toastBar var(--dur,5s) linear forwards;}

/* ── Section label ── */
.sec-label{
  font-size:11px;text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);font-weight:700;padding:18px 16px 8px;
}
.sec-label span{font-size:13px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--muted);margin-left:6px;}

/* ── Inline confirm ── */
.inline-confirm{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--danger-bg);border:1px solid var(--danger);
  border-radius:8px;padding:5px 10px;font-size:12px;color:var(--danger);
}

/* ── Lightbox ── */
.lightbox{position:fixed;inset:0;background:rgba(15,12,8,.88);display:grid;place-items:center;z-index:500;cursor:zoom-out;padding:24px;}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);}

/* ── Day reminder ── */
.day-reminder{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);}
.day-reminder label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;display:block;margin-bottom:6px;}

/* ── Add day inline ── */
.add-day-row{display:flex;gap:8px;margin:4px 14px 14px;flex-wrap:wrap;}

/* ── Add place form ── */
.add-place-sheet{display:flex;flex-direction:column;gap:12px;}

/* ── Print ── (PDF now opens in new window, no in-page frame needed) ── */


/* ── Animations ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toastBar{from{width:100%}to{width:0%}}
@keyframes syncPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* ── Dark mode inputs ── */
[data-theme=dark] .input,[data-theme=dark] .textarea,[data-theme=dark] .select{background:var(--bg2);}
[data-theme=dark] .day-card{background:var(--paper);}
[data-theme=dark] .trip-card{background:var(--paper);}
[data-theme=dark] .modal{background:var(--paper);}
[data-theme=dark] .search-result-match{background:oklch(68% 0.16 48/.25);color:var(--accent-ink);}
.search-result-match{background:oklch(68% 0.16 48/.18);color:var(--accent-ink);border-radius:2px;padding:0 1px;}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ── Storage ── */
const STORAGE_KEY = 'travelplan.v6';  // bumped to avoid stale local data
const API_URL = '/api/trips';
const uid = () => Math.random().toString(36).slice(2,10);
const formatTime24 = t => { if(!t) return '—'; const [h,m]=t.split(':'); if(h===undefined||m===undefined) return t; return `${String(Number(h)).padStart(2,'0')}:${String(Number(m)).padStart(2,'0')}`; };

/* ── Cloud sync helpers ── */
async function fetchTripsFromCloud() {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 10000); // 10s
    const res = await fetch(API_URL, { cache: 'no-store', signal: ctrl.signal });
    clearTimeout(timeout);
    if (!res.ok) {
      console.warn('[sync] GET failed HTTP', res.status);
      return null;
    }
    // Guard: Netlify error pages return HTML, not JSON
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      console.warn('[sync] GET non-JSON response:', ct);
      return null;
    }
    const data = await res.json();
    return Array.isArray(data) ? data : null;
  } catch (e) {
    console.warn('[sync] fetch failed:', e.message);
    return null;
  }
}

async function saveTripsToCloud(trips) {
  try {
    const ctrl = new AbortController();
    const timeout = setTimeout(()=>ctrl.abort(), 20000); // 20s — photos can be large
    const body = JSON.stringify(trips);
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body,
      signal: ctrl.signal,
    });
    clearTimeout(timeout);
    if (!res.ok) {
      const errText = await res.text().catch(()=>'unknown error');
      console.error('[sync] POST failed HTTP', res.status, errText.slice(0, 200));
      return false;
    }
    // Guard: Netlify error pages return HTML, not JSON
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      console.error('[sync] POST non-JSON response:', ct);
      return false;
    }
    const json = await res.json().catch(()=>({ok:true}));
    console.log('[sync] saved OK:', json.count, 'trips at', json.at);
    return true;
  } catch (e) {
    console.warn('[sync] save failed:', e.name, e.message);
    return false;
  }
}

/* ── Toast ── */
let _setToasts=null; const TOAST_MS=5000;
function pushToast({message,onUndo}){
  const id=uid();
  const timer=setTimeout(()=>{ _setToasts&&_setToasts(ts=>ts.filter(t=>t.id!==id)); },TOAST_MS);
  const dismiss=(runUndo=false)=>{ clearTimeout(timer); if(runUndo&&onUndo) onUndo(); _setToasts&&_setToasts(ts=>ts.filter(t=>t.id!==id)); };
  _setToasts&&_setToasts(ts=>[...ts,{id,message,dismiss,hasUndo:!!onUndo}]);
  return dismiss;
}
function ToastStack(){
  const [toasts,setToasts]=useState([]);
  useEffect(()=>{ _setToasts=setToasts; return()=>{ _setToasts=null; }; },[]);
  if(!toasts.length) return null;
  return <div className="toast-stack">{toasts.map(t=>(
    <div key={t.id} className="toast">
      <span style={{flex:1}}>{t.message}</span>
      {t.hasUndo&&<button className="toast-undo" onClick={()=>t.dismiss(true)}>Undo</button>}
      <div className="toast-progress" style={{'--dur':TOAST_MS+'ms'}}/>
    </div>
  ))}</div>;
}

/* ── PDF ── */
const KIND_ABBR={food:'🍴',attraction:'📷',lodging:'🛏',transport:'🚆',other:'📌'};
const KIND_BADGE_CLASS={food:'badge-food',attraction:'badge-attraction',lodging:'badge-lodging',transport:'badge-transport',other:'badge-other'};
const KIND_LABEL={food:'Food',attraction:'Sights',lodging:'Lodging',transport:'Transport',other:'Other'};

/* Preload all base64 images so they're decoded before print fires */
function preloadImages(srcs){
  return Promise.all(srcs.filter(Boolean).map(src=>new Promise(res=>{
    const img=new Image(); img.onload=img.onerror=res; img.src=src;
  })));
}

async function exportTripPDF(trip){
  const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WDAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const fmtD=iso=>{ if(!iso) return ''; const d=new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  const fmtDLong=iso=>{ if(!iso) return ''; const d=new Date(iso); return `${WDAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const dur=trip.startDate&&trip.endDate?Math.round((new Date(trip.endDate)-new Date(trip.startDate))/86400000)+1:null;

  /* ── Collect all image srcs for preload ── */
  const allImgs=[
    ...trip.itinerary.flatMap(d=>d.items.map(it=>it.image||'')),
    ...trip.places.map(p=>p.image||''),
  ].filter(Boolean);

  /* ── Build itinerary HTML ── */
  const itinHtml=trip.itinerary.map((day,i)=>{
    const itemsHtml=day.items.map(it=>{
      const photoHtml=it.image
        ? `<img class="pf-item-photo" src="${it.image}" alt="${esc(it.title||'')}">`
        : '';
      const doneClass=it.done?' pf-done':'';
      return `<div class="pf-item${doneClass}">
        ${photoHtml}
        <div class="pf-time-pill">${esc(it.time?formatTime24(it.time):'—')}${it.duration?` <span class="pf-dur">· ${esc(it.duration)}</span>`:''}</div>
        <div class="pf-it">${esc(it.title||'(untitled)')}</div>
        ${it.location?`<div class="pf-il">${esc(it.location)}</div>`:''}
        ${it.notes?`<div class="pf-in">${esc(it.notes)}</div>`:''}
      </div>`;
    }).join('');
    const photoCount=day.items.filter(it=>it.image).length;
    return `<div class="pf-day">
      <div class="pf-dh">
        <div class="pf-dn">${i+1}</div>
        <div class="pf-dinfo">
          <div class="pf-dt">${esc(fmtDLong(day.date))}</div>
          ${day.label?`<div class="pf-dl">${esc(day.label)}</div>`:''}
        </div>
        <div class="pf-dcount">${day.items.length} activit${day.items.length===1?'y':'ies'}${photoCount>0?' · '+photoCount+' photo'+(photoCount>1?'s':''):''}</div>
      </div>
      ${itemsHtml}
      ${day.notes?`<div class="pf-day-note">⏰ ${esc(day.notes)}</div>`:''}
    </div>`;
  }).join('');

  /* ── Build places HTML — grouped by kind ── */
  const placeGroups={};
  const KIND_ORDER=['food','attraction','lodging','transport','other'];
  trip.places.forEach(p=>{ const k=p.kind||'other'; if(!placeGroups[k]) placeGroups[k]=[]; placeGroups[k].push(p); });
  const placesHtml=KIND_ORDER
    .filter(k=>placeGroups[k]&&placeGroups[k].length>0)
    .map(kind=>{
      const places=placeGroups[kind];
      const rows=places.map(p=>{
        const photoHtml=p.image?`<img class="pf-pc-photo" src="${p.image}" alt="${esc(p.name||'')}">`:'' ;
        const badgeClass=KIND_BADGE_CLASS[kind]||'badge-other';
        return `<div class="pf-pc">
          ${photoHtml}
          <div class="pf-pc-badge ${badgeClass}">${KIND_ABBR[kind]||'📌'} ${KIND_LABEL[kind]||kind}</div>
          <div class="pf-pn">${esc(p.name||'Untitled')}${p.city?`<span class="pf-pcity">${esc(p.city)}</span>`:''}</div>
          ${p.address?`<div class="pf-pa">${esc(p.address)}</div>`:''}
          ${p.notes?`<div class="pf-po">${esc(p.notes)}</div>`:''}
        </div>`;
      }).join('');
      return `<div class="pf-kind-head"><span>${KIND_ABBR[kind]||'📌'} ${KIND_LABEL[kind]||kind}</span><div class="pf-kind-line"></div><span style="font-size:10px;font-weight:400;color:#b0a898">${places.length}</span></div>${rows}`;
    }).join('');

  const totalPhotos=allImgs.length;
  const totalActs=trip.itinerary.reduce((s,d)=>s+d.items.length,0);
  const printDate=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  /* ── Standalone CSS — self-contained, no app shell interference ── */
  const css=`
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap');
    @page{ margin:16mm 18mm; size:A4 portrait; }
    *{ box-sizing:border-box; -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
    html,body{ margin:0; padding:0; background:#fff; font-family:'Inter',system-ui,sans-serif; font-size:12.5px; color:#1c1815; line-height:1.55; }

    /* ── Cover ── */
    .pf-cover{ border-bottom:3px solid #1c1815; padding-bottom:20px; margin-bottom:24px; }
    .pf-cover h1{ font-family:'Fraunces',serif; font-size:32px; font-weight:700; margin:0 0 10px; letter-spacing:-.025em; line-height:1.1; }
    .pf-meta{ display:flex; flex-wrap:wrap; gap:5px 16px; font-size:11.5px; color:#6b6056; margin-bottom:6px; }
    .pf-meta span{ display:inline-flex; align-items:center; gap:4px; }
    .pf-notes{ background:#f6f1e8; border-left:3px solid #c8a96e; padding:10px 14px; font-size:12px; color:#4a4239; line-height:1.55; white-space:pre-wrap; margin-top:14px; border-radius:0 6px 6px 0; }

    /* ── Section label ── */
    .pf-sl{ font-size:9px; letter-spacing:.18em; text-transform:uppercase; font-weight:800; color:#9a8f80; border-bottom:1px solid #e3d9c6; padding-bottom:6px; margin:28px 0 16px; }

    /* ── Day block — ALLOW page breaks inside so content isn't squashed ── */
    .pf-day{ margin-bottom:4px; }
    .pf-dh{ display:flex; align-items:center; gap:12px; background:#f0ebe0; border-radius:8px; padding:9px 14px; margin-bottom:8px; page-break-after:avoid; break-after:avoid; }
    .pf-dn{ width:30px; height:30px; border-radius:8px; flex-shrink:0; background:#1c1815; color:#f6f1e8; display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:700; font-size:14px; }
    .pf-dinfo{ flex:1; }
    .pf-dt{ font-weight:700; font-size:13px; color:#1c1815; }
    .pf-dl{ font-size:11px; color:#8a7f70; margin-top:1px; }
    .pf-dcount{ font-size:10px; font-weight:600; color:#9a8f80; background:#e8e0d2; padding:3px 8px; border-radius:99px; white-space:nowrap; }

    /* ── Activity item ── */
    .pf-item{ display:block; width:100%; padding:9px 0 9px 14px; border-left:2px solid #e3d9c6; margin-bottom:6px; overflow:hidden; page-break-inside:avoid; break-inside:avoid; }
    .pf-item::after{ content:''; display:table; clear:both; }
    .pf-item-photo{ float:right; width:72px; height:72px; margin:0 0 6px 12px; border-radius:8px; object-fit:cover; border:1px solid #e3d9c6; display:block; flex-shrink:0; }
    .pf-time-pill{ display:inline-flex; align-items:center; gap:5px; background:#f6f1e8; border:1px solid #e3d9c6; border-radius:6px; padding:2px 8px; font-family:'JetBrains Mono',monospace; font-size:11px; color:#7a5c3a; font-weight:600; margin-bottom:5px; }
    .pf-dur{ color:#b0a898; font-size:10px; font-weight:400; }
    .pf-it{ font-weight:700; font-size:13px; color:#1c1815; margin-bottom:2px; }
    .pf-il{ font-size:11px; color:#8a7f70; margin-bottom:3px; }
    .pf-il::before{ content:"📍 "; font-size:10px; }
    .pf-in{ font-size:11.5px; color:#4a4239; white-space:pre-wrap; line-height:1.5; border-left:2px solid #f0c89e; padding-left:8px; margin-top:4px; }
    .pf-done{ opacity:.5; }
    .pf-done .pf-it{ text-decoration:line-through; }
    .pf-day-note{ font-size:11px; color:#8a7f70; margin:4px 0 14px 14px; border-left:2px solid #f0c89e; padding-left:9px; }

    /* ── Page break helper — force each new day to start fresh on long trips ── */
    .pf-page-break{ page-break-before:always; break-before:page; height:0; margin:0; padding:0; }

    /* ── Places ── */
    .pf-kind-head{ display:flex; align-items:center; gap:8px; font-size:10px; font-weight:700; color:#8a7f70; text-transform:uppercase; letter-spacing:.1em; margin:14px 0 8px; }
    .pf-kind-line{ flex:1; height:1px; background:#e3d9c6; }
    .pf-pc{ display:block; width:100%; padding:10px 0; border-bottom:1px solid #f0ebe0; overflow:hidden; page-break-inside:avoid; break-inside:avoid; }
    .pf-pc:last-child{ border-bottom:none; }
    .pf-pc::after{ content:''; display:table; clear:both; }
    .pf-pc-photo{ float:right; width:80px; height:80px; margin:0 0 8px 14px; border-radius:10px; object-fit:cover; border:1px solid #e3d9c6; display:block; }
    .pf-pc-badge{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:99px; font-size:9.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:4px; }
    .badge-food{ background:#fef3e8; color:#b06020; }
    .badge-attraction{ background:#eaf5ea; color:#2d7a3a; }

    .badge-transport{ background:#e8f2fc; color:#1a5e9a; }

  /* ── Smart page-break insertion:
     Insert a page-break div every 4 days to prevent the browser from
     trying to fit 8 days on one page. Days with many items get their
     own break earlier. ── */
  const DAYS_PER_PAGE=3;
  const dayBlocks=trip.itinerary.map((day,i)=>{
    const itemsHtml=day.items.map(it=>{
      const photoHtml=it.image?`<img class="pf-item-photo" src="${it.image}" alt="${esc(it.title||'')}">`:'' ;
      const doneClass=it.done?' pf-done':'';
      return `<div class="pf-item${doneClass}">
        ${photoHtml}
        <div class="pf-time-pill">${esc(it.time?formatTime24(it.time):'—')}${it.duration?` <span class="pf-dur">· ${esc(it.duration)}</span>`:''}</div>
        <div class="pf-it">${esc(it.title||'(untitled)')}</div>
        ${it.location?`<div class="pf-il">${esc(it.location)}</div>`:''}
        ${it.notes?`<div class="pf-in">${esc(it.notes)}</div>`:''}
      </div>`;
    }).join('');
    const photoCount=day.items.filter(it=>it.image).length;
    const pageBreakBefore=(i>0 && i%DAYS_PER_PAGE===0)?'<div class="pf-page-break"></div>':'';
    return `${pageBreakBefore}<div class="pf-day">
      <div class="pf-dh">
        <div class="pf-dn">${i+1}</div>
        <div class="pf-dinfo">
          <div class="pf-dt">${esc(fmtDLong(day.date))}</div>
          ${day.label?`<div class="pf-dl">${esc(day.label)}</div>`:''}
        </div>
        <div class="pf-dcount">${day.items.length} activit${day.items.length===1?'y':'ies'}${photoCount>0?' · '+photoCount+' photo'+(photoCount>1?'s':''):''}</div>
      </div>
      ${itemsHtml}
      ${day.notes?`<div class="pf-day-note">⏰ ${esc(day.notes)}</div>`:''}
    </div>`;
  }).join('');

  /* ── Full HTML document ── */
  const html=`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>${esc(trip.title)} — Travel Plan</title>
  <style>${css}</style>
</head>
<body>

  <!-- COVER -->
  <div class="pf-cover">
    <h1>${esc(trip.title)}</h1>
    <div class="pf-meta">
      ${trip.origin?`<span>✈️ From ${esc(trip.origin)}</span>`:''}
      ${trip.destination?`<span>📍 ${esc(trip.destination)}</span>`:''}
      ${trip.startDate?`<span>📅 ${fmtD(trip.startDate)}${trip.endDate?' – '+fmtD(trip.endDate):''}${dur?' · '+dur+' days':''}</span>`:''}
      ${trip.travelers?`<span>👥 ${trip.travelers} traveler${trip.travelers>1?'s':''}</span>`:''}
      ${trip.budget?`<span>💰 ${esc(trip.currency)} ${Number(trip.budget).toLocaleString()}</span>`:''}
      ${trip.itinerary.length?`<span>📋 ${trip.itinerary.length} days · ${totalActs} activities</span>`:''}
      ${trip.places.length?`<span>📌 ${trip.places.length} saved places</span>`:''}
      ${totalPhotos>0?`<span>🖼 ${totalPhotos} photo${totalPhotos>1?'s':''}</span>`:''}
    </div>
    ${trip.notes?`<div class="pf-notes">${esc(trip.notes)}</div>`:''}
  </div>

  <!-- ITINERARY -->
  ${trip.itinerary.length?`<div class="pf-sl">Itinerary — ${trip.itinerary.length} days · ${totalActs} activities</div>${dayBlocks}`:''}

  <!-- PLACES -->
  ${trip.places.length?`<div class="pf-sl" style="page-break-before:always;break-before:page;">Saved places — ${trip.places.length} total</div>${placesHtml}`:''}

  <!-- FOOTER -->
  <div class="pf-ft">
    <span>Travel Plan · ${esc(trip.title)}</span>
    <span>Printed ${printDate}</span>
  </div>

  <!-- Auto-print script — waits for all images to load then triggers print -->
  <script>
    var imgs = document.querySelectorAll('img');
    var total = imgs.length;
    if(total === 0){
      window.print();
    } else {
      var loaded = 0;
      var onLoad = function(){ loaded++; if(loaded >= total) window.print(); };
      Array.from(imgs).forEach(function(img){
        if(img.complete){ onLoad(); }
        else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
      });
      // Failsafe: print after 3s even if some images fail
      setTimeout(function(){ window.print(); }, 3000);
    }
  <\/script>
</body>
</html>`;

  /* ── Preload images in current window, then open print window ── */
  try{ await preloadImages(allImgs); }catch(e){}

  const win=window.open('','_blank','width=800,height=900');
  if(!win){ alert('Please allow pop-ups for this site to export PDF.'); return; }
  win.document.write(html);
  win.document.close();
}

function exportJSON(trips){
  const blob=new Blob([JSON.stringify(trips,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=`travel-plans-${new Date().toISOString().slice(0,10)}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

/* ── Helpers ── */
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDMY=iso=>{ if(!iso) return ''; const d=new Date(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const fmtDateRange=(a,b)=>{ if(!a&&!b) return 'Dates TBD'; if(a&&b) return `${fmtDMY(a)} – ${fmtDMY(b)}`; return fmtDMY(a||b); };
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtDayHeader=iso=>{ if(!iso) return 'No date'; const d=new Date(iso); return `${WEEKDAYS[d.getDay()]}, ${fmtDMY(iso)}`; };
const tripDuration=(a,b)=>{ if(!a||!b) return null; const d=Math.round((new Date(b)-new Date(a))/86400000)+1; return d>0?d:null; };
const initialOf=s=>(s||'?').trim().charAt(0).toUpperCase()||'?';
const mapsUrl=p=>{ const q=[p.name||p.title,p.address||p.location].filter(Boolean).join(', '); return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`; };
const amapUrl=p=>{ const name=encodeURIComponent(p.name||p.title||''); const addr=encodeURIComponent(p.address||p.location||''); return `https://uri.amap.com/search?keyword=${addr||name}&name=${name}&src=travel-plan&callnative=1`; };
const fileToDataURL=(file,maxDim=1400)=>new Promise((resolve,reject)=>{
  if(!file) return resolve('');
  const reader=new FileReader(); reader.onerror=reject;
  reader.onload=()=>{ const img=new Image(); img.onload=()=>{ let{width,height}=img; if(width>maxDim||height>maxDim){const r=Math.min(maxDim/width,maxDim/height);width=Math.round(width*r);height=Math.round(height*r);} const canvas=document.createElement('canvas'); canvas.width=width; canvas.height=height; canvas.getContext('2d').drawImage(img,0,0,width,height); resolve(canvas.toDataURL('image/jpeg',.85)); }; img.onerror=reject; img.src=reader.result; };
  reader.readAsDataURL(file);
});

/* loadTrips — returns cached local data immediately (for fast first render) */
const loadTrips=()=>{
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return seedTrips();
    const parsed=JSON.parse(raw);
    if(!Array.isArray(parsed)||parsed.length===0) return seedTrips();
    return parsed.map(t=>({itinerary:[],places:[],origin:'',...t}));
  }catch{ return seedTrips(); }
};

function MapPicker({placeOrItem,label='Map'}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{
    if(!open) return;
    const handler=e=>{ if(!ref.current?.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown',handler);
    return()=>document.removeEventListener('mousedown',handler);
  },[open]);
  return(
    <div className="map-picker" ref={ref}>
      <button className="map-btn" onClick={e=>{e.stopPropagation();setOpen(o=>!o)}}>
        <Icon name="map" style={{width:13,height:13}}/>
        {label}
        <Icon name="chev" style={{width:10,height:10,opacity:.6}}/>
      </button>
      {open&&(
        <div className="map-menu">
          <a className="mm-google" href={mapsUrl(placeOrItem)} target="_blank" rel="noopener noreferrer" onClick={()=>setOpen(false)}>
            <span className="mm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <span>Google Maps<span className="mm-sub">maps.google.com</span></span>
          </a>
          <a className="mm-amap" href={amapUrl(placeOrItem)} target="_blank" rel="noopener noreferrer" onClick={()=>setOpen(false)}>
            <span className="mm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 1 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
            <span>高德地图 Amap<span className="mm-sub">amap.com · opens app on mobile</span></span>
          </a>
        </div>
      )}
    </div>
  );
}

/* ── Highlight ── */
function Highlight({text,query}){
  if(!query||!text) return <>{text||''}</>;
  const idx=text.toLowerCase().indexOf(query.toLowerCase());
  if(idx===-1) return <>{text}</>;
  return <>{text.slice(0,idx)}<mark className="search-result-match">{text.slice(idx,idx+query.length)}</mark>{text.slice(idx+query.length)}</>;
}

/* ═══════════════════════════════════════════════════════
   APP — Mobile-first with screen stack navigation
═══════════════════════════════════════════════════════ */
function App(){
  const [trips,setTrips]=useState(loadTrips);
  const [selectedId,setSelectedId]=useState(()=>loadTrips()[0]?.id||null);
  const [modal,setModal]=useState(null);
  const [lightbox,setLightbox]=useState(null);
  const [dark,setDark]=useState(()=>localStorage.getItem('theme')==='dark');
  // Mobile nav: 'trips' | 'detail'
  const [screen,setScreen]=useState('trips');
  // Bottom tab within detail: 'itinerary' | 'places' | 'info'
  const [detailTab,setDetailTab]=useState('itinerary');

  // ── Sync state ────────────────────────────────────────────
  const [syncStatus,setSyncStatus]=useState('syncing'); // idle | syncing | saved | error | offline
  const saveQueueRef=useRef(null);        // debounce timer
  const lastCloudDataRef=useRef(null);    // last JSON string received/sent to cloud
  const isInitializedRef=useRef(false);   // BLOCKS save-to-cloud until initial fetch done
  const mountedRef=useRef(true);          // prevents state updates after unmount

  // ── Theme effect ──────────────────────────────────────────
  useEffect(()=>{
    document.documentElement.setAttribute('data-theme',dark?'dark':'light');
    localStorage.setItem('theme',dark?'dark':'light');
    document.querySelector('#theme-meta')?.setAttribute('content',dark?'#1a1510':'#f6f1e8');
  },[dark]);

  // ── Cleanup on unmount ────────────────────────────────────
  useEffect(()=>()=>{ mountedRef.current=false; },[]);

  // ── Initial cloud load — on mount, fetch shared data ──────
  useEffect(()=>{
    setSyncStatus('syncing');
    fetchTripsFromCloud().then(async cloudTrips=>{
      if(!mountedRef.current) return;
      if(cloudTrips===null){
        // Cloud unreachable — stay with local cache, allow local saves
        isInitializedRef.current=true;
        setSyncStatus('offline');
        return;
      }
      const cloudStr=JSON.stringify(cloudTrips);
      if(cloudTrips.length>0){
        // Cloud has authoritative data — load it, update local cache
        lastCloudDataRef.current=cloudStr;
        setTrips(cloudTrips.map(t=>({itinerary:[],places:[],origin:'',...t})));
        try{localStorage.setItem(STORAGE_KEY,cloudStr);}catch(e){}
      } else {
        // Cloud is empty (brand-new deploy) — push local data up once
        const local=loadTrips();
        const localStr=JSON.stringify(local);
        const ok=await saveTripsToCloud(local);
        if(ok) lastCloudDataRef.current=localStr;
        // trips state already set from useState(loadTrips) — no re-set needed
      }
      // CRITICAL: only NOW allow the save-effect to write to cloud
      isInitializedRef.current=true;
      if(mountedRef.current) setSyncStatus('idle');
    });
  },[]);

  // ── Save to cloud whenever trips change (debounced 1s) ─────
  useEffect(()=>{
    // 1. Always write to localStorage immediately (offline/crash safety)
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(trips));}
    catch(e){console.warn('localStorage full',e);}

    // 2. Block cloud save until initial fetch is done (prevents overwrite race)
    if(!isInitializedRef.current) return;

    // 3. Skip if this data came FROM cloud (prevent echo loop)
    const currentStr=JSON.stringify(trips);
    if(currentStr===lastCloudDataRef.current) return;

    // 4. Debounce — wait 1s after last keystroke before hitting the API
    clearTimeout(saveQueueRef.current);
    setSyncStatus('syncing');
    saveQueueRef.current=setTimeout(async()=>{
      if(!mountedRef.current) return;
      const snapshot=trips; // capture at dispatch time
      const ok=await saveTripsToCloud(snapshot);
      if(!mountedRef.current) return;
      if(ok){
        lastCloudDataRef.current=JSON.stringify(snapshot);
        setSyncStatus('saved');
        setTimeout(()=>{ if(mountedRef.current) setSyncStatus('idle'); },2500);
      } else {
        setSyncStatus('error');
        // Retry once after 5s on failure
        setTimeout(async()=>{
          if(!mountedRef.current) return;
          const retry=await saveTripsToCloud(snapshot);
          if(retry){
            lastCloudDataRef.current=JSON.stringify(snapshot);
            setSyncStatus('saved');
            setTimeout(()=>{ if(mountedRef.current) setSyncStatus('idle'); },2500);
          }
        },5000);
      }
    },1000);
  },[trips]);

  // ── Poll + Visibility sync ────────────────────────────────
  useEffect(()=>{
    async function checkForUpdates(){
      if(!isInitializedRef.current) return; // still loading
      if(syncStatus==='syncing') return;     // we're mid-save, skip
      const cloudTrips=await fetchTripsFromCloud();
      if(!cloudTrips||!mountedRef.current) return;
      const cloudStr=JSON.stringify(cloudTrips);
      if(cloudStr!==lastCloudDataRef.current && cloudStr!==JSON.stringify(trips)){
        lastCloudDataRef.current=cloudStr;
        setTrips(cloudTrips.map(t=>({itinerary:[],places:[],origin:'',...t})));
        try{localStorage.setItem(STORAGE_KEY,cloudStr);}catch(e){}
        pushToast({message:'✦ Trip data updated — refreshed'});
      }
    }
    // Poll every 20s
    const interval=setInterval(checkForUpdates,20000);
    // Also sync immediately when user returns to the tab (phone unlock, tab switch)
    const onVisible=()=>{ if(document.visibilityState==='visible') checkForUpdates(); };
    document.addEventListener('visibilitychange',onVisible);
    return()=>{ clearInterval(interval); document.removeEventListener('visibilitychange',onVisible); };
  },[syncStatus,trips]);

  const selected=trips.find(t=>t.id===selectedId)||null;

  const updateTrip=(id,patch)=>setTrips(ts=>ts.map(t=>t.id===id?{...t,...patch}:t));
  const deleteTrip=id=>{
    const snap=trips.find(t=>t.id===id);
    const prev=selectedId;
    setTrips(ts=>ts.filter(t=>t.id!==id));
    if(selectedId===id){ const r=trips.filter(t=>t.id!==id); setSelectedId(r[0]?.id||null); setScreen('trips'); }
    pushToast({message:`Trip "${snap?.title||'Untitled'}" deleted`,onUndo:()=>{ setTrips(ts=>{ const i=ts.findIndex(t=>t.id>id); const c=[...ts]; c.splice(i===-1?c.length:i,0,snap); return c; }); setSelectedId(prev); }});
  };
  const createTrip=data=>{ const trip={id:uid(),title:data.title||'Untitled trip',destination:data.destination||'',origin:data.origin||'',startDate:data.startDate||'',endDate:data.endDate||'',travelers:data.travelers||1,budget:'',currency:'HKD',notes:'',itinerary:[],places:[]}; setTrips(ts=>[trip,...ts]); setSelectedId(trip.id); };
  const addDay=(tripId,date)=>{ const day={id:uid(),date:date||'',label:'',items:[],notes:''}; setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:[...t.itinerary,day].sort((a,b)=>(a.date||'').localeCompare(b.date||''))}:t)); };
  const updateDay=(tripId,dayId,patch)=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.map(d=>d.id===dayId?{...d,...patch}:d).sort((a,b)=>(a.date||'').localeCompare(b.date||''))}:t));
  const deleteDay=(tripId,dayId)=>{ const trip=trips.find(t=>t.id===tripId); const snap=trip?.itinerary.find(d=>d.id===dayId); const snapIdx=trip?.itinerary.findIndex(d=>d.id===dayId)??-1; setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.filter(d=>d.id!==dayId)}:t)); pushToast({message:`Day "${snap?.label||fmtDayHeader(snap?.date)||'Day'}" deleted`,onUndo:()=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:(()=>{ const c=[...t.itinerary]; c.splice(snapIdx===-1?c.length:snapIdx,0,snap); return c; })()}:t))}); };
  const reorderDays=(tripId,fromId,toId)=>setTrips(ts=>ts.map(t=>{ if(t.id!==tripId) return t; const arr=[...t.itinerary]; const from=arr.findIndex(d=>d.id===fromId); const to=arr.findIndex(d=>d.id===toId); if(from===-1||to===-1||from===to) return t; const [item]=arr.splice(from,1); arr.splice(to,0,item); return{...t,itinerary:arr}; }));
  const addItem=(tripId,dayId,item)=>{ const ni={id:uid(),time:'',duration:'',title:'',location:'',notes:'',image:'',done:false,...item}; setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.map(d=>d.id===dayId?{...d,items:[...d.items,ni].sort((a,b)=>(a.time||'').localeCompare(b.time||''))}:d)}:t)); };
  const updateItem=(tripId,dayId,itemId,patch)=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.map(d=>d.id===dayId?{...d,items:d.items.map(it=>it.id===itemId?{...it,...patch}:it).sort((a,b)=>(a.time||'').localeCompare(b.time||''))}:d)}:t));
  const deleteItem=(tripId,dayId,itemId)=>{ const day=trips.find(t=>t.id===tripId)?.itinerary.find(d=>d.id===dayId); const snap=day?.items.find(it=>it.id===itemId); const snapIdx=day?.items.findIndex(it=>it.id===itemId)??-1; setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.map(d=>d.id===dayId?{...d,items:d.items.filter(it=>it.id!==itemId)}:d)}:t)); pushToast({message:`"${snap?.title||'Activity'}" deleted`,onUndo:()=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,itinerary:t.itinerary.map(d=>d.id===dayId?{...d,items:(()=>{ const c=[...d.items]; c.splice(snapIdx===-1?c.length:snapIdx,0,snap); return c.sort((a,b)=>(a.time||'').localeCompare(b.time||'')); })()}:d)}:t))}); };
  const reorderItems=(tripId,dayId,fromId,toId)=>setTrips(ts=>ts.map(t=>{ if(t.id!==tripId) return t; return{...t,itinerary:t.itinerary.map(d=>{ if(d.id!==dayId) return d; const arr=[...d.items]; const from=arr.findIndex(it=>it.id===fromId); const to=arr.findIndex(it=>it.id===toId); if(from===-1||to===-1||from===to) return d; const [item]=arr.splice(from,1); arr.splice(to,0,item); return{...d,items:arr}; })}; }));
  const addPlace=(tripId,place)=>{ const p={id:uid(),kind:'other',name:'',address:'',city:'',notes:'',image:'',...place}; setTrips(ts=>ts.map(t=>t.id===tripId?{...t,places:[...t.places,p]}:t)); };
  const updatePlace=(tripId,placeId,patch)=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,places:t.places.map(p=>p.id===placeId?{...p,...patch}:p)}:t));
  const deletePlace=(tripId,placeId)=>{ const trip=trips.find(t=>t.id===tripId); const snap=trip?.places.find(p=>p.id===placeId); setTrips(ts=>ts.map(t=>t.id===tripId?{...t,places:t.places.filter(p=>p.id!==placeId)}:t)); pushToast({message:`"${snap?.name||'Place'}" removed`,onUndo:()=>setTrips(ts=>ts.map(t=>t.id===tripId?{...t,places:[...t.places,snap]}:t))}); };

  const openTrip=id=>{ setSelectedId(id); setDetailTab('itinerary'); setScreen('detail'); };
  const goBack=()=>setScreen('trips');

  return (
    <div id="root">
      {/* ── Trips screen ── */}
      <div className={`screen${screen==='trips'?'':' screen-forward'}`}
           style={{transform:screen==='trips'?'translateX(0)':'translateX(-30%)',zIndex:screen==='trips'?10:5}}>
        <TripsScreen
          trips={trips} selectedId={selectedId}
          dark={dark} onToggleDark={()=>setDark(d=>!d)}
          syncStatus={syncStatus}
          onRetry={()=>{
            setSyncStatus('syncing');
            saveTripsToCloud(trips).then(ok=>{
              if(!mountedRef.current) return;
              if(ok){ lastCloudDataRef.current=JSON.stringify(trips); setSyncStatus('saved'); setTimeout(()=>setSyncStatus('idle'),2500); }
              else setSyncStatus('error');
            });
          }}
          onSelect={openTrip}
          onNew={()=>setModal({type:'new-trip'})}
          onExport={()=>exportJSON(trips)}
        />
      </div>

      {/* ── Detail screen ── */}
      <div className={`screen${screen==='detail'?'':' screen-forward'}`}
           style={{transform:screen==='detail'?'translateX(0)':'translateX(100%)',zIndex:screen==='detail'?10:5}}>
        {selected&&(
          <DetailScreen
            trip={selected} tab={detailTab} onTabChange={setDetailTab}
            onBack={goBack}
            onUpdate={patch=>updateTrip(selected.id,patch)}
            onDelete={()=>{deleteTrip(selected.id);goBack();}}
            onAddDay={date=>addDay(selected.id,date)}
            onUpdateDay={(did,patch)=>updateDay(selected.id,did,patch)}
            onDeleteDay={did=>deleteDay(selected.id,did)}
            onAddItem={(did,it)=>addItem(selected.id,did,it)}
            onUpdateItem={(did,iid,patch)=>updateItem(selected.id,did,iid,patch)}
            onDeleteItem={(did,iid)=>deleteItem(selected.id,did,iid)}
            onReorderDays={(f,t)=>reorderDays(selected.id,f,t)}
            onReorderItems={(did,f,t)=>reorderItems(selected.id,did,f,t)}
            onAddPlace={p=>addPlace(selected.id,p)}
            onUpdatePlace={(pid,patch)=>updatePlace(selected.id,pid,patch)}
            onDeletePlace={pid=>deletePlace(selected.id,pid)}
            onShowImage={setLightbox}
            onPrint={()=>exportTripPDF(selected)}
          />
        )}
      </div>

      {modal?.type==='new-trip'&&<NewTripModal onClose={()=>setModal(null)} onCreate={data=>{createTrip(data);setModal(null);}} openAfter={()=>openTrip(null)}/>}
      {lightbox&&<div className="lightbox" onClick={()=>setLightbox(null)}><img src={lightbox} alt=""/></div>}
      <ToastStack/>
    </div>
  );
}

/* ── Sync status pill ── */
function SyncPill({status, onRetry}){
  const cfg={
    idle:     {dot:'#8a7f70',label:'',bg:'transparent',border:'transparent',color:'var(--muted)'},
    syncing:  {dot:'#f5a623',label:'Syncing…',bg:'oklch(95% 0.06 75)',border:'oklch(80% 0.10 75)',color:'oklch(42% 0.14 50)'},
    saved:    {dot:'#3cb371',label:'✓ Saved',bg:'oklch(94% 0.04 150)',border:'oklch(78% 0.10 150)',color:'oklch(38% 0.12 150)'},
    error:    {dot:'#e05252',label:'Save failed',bg:'oklch(96% 0.03 25)',border:'oklch(80% 0.12 25)',color:'oklch(42% 0.18 25)'},
    offline:  {dot:'#8a7f70',label:'Offline',bg:'var(--bg2)',border:'var(--line)',color:'var(--muted)'},
  };
  const c=cfg[status]||cfg.idle;
  if(status==='idle') return null;
  return(
    <div style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 10px',borderRadius:99,fontSize:11.5,fontWeight:600,background:c.bg,border:'1px solid '+c.border,color:c.color,transition:'all .3s',flexShrink:0}}>
      <span style={{width:6,height:6,borderRadius:'50%',background:c.dot,display:'block',flexShrink:0,animation:status==='syncing'?'syncPulse 1.2s ease infinite':'none'}}/>
      {c.label}
      {status==='error'&&onRetry&&(
        <button onClick={onRetry} style={{marginLeft:4,padding:'1px 7px',borderRadius:5,background:'var(--danger)',color:'#fff',border:'none',fontSize:10.5,fontWeight:700,cursor:'pointer',lineHeight:1.5}}>
          Retry
        </button>
      )}
    </div>
  );
}

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      {/* Header */}

          <div style={{display:'flex',alignItems:'center',gap:10}}>

            <div>
              <div style={{fontFamily:"'Fraunces',serif",fontSize:20,fontWeight:700,letterSpacing:'-.02em',lineHeight:1.1}}>Travel Plan</div>

/* ── Detail Screen ── */
function DetailScreen({trip,tab,onTabChange,onBack,onUpdate,onDelete,onAddDay,onUpdateDay,onDeleteDay,onAddItem,onUpdateItem,onDeleteItem,onReorderDays,onReorderItems,onAddPlace,onUpdatePlace,onDeletePlace,onShowImage,onPrint}){
  const [searchQuery,setSearchQuery]=useState('');
  const dur=tripDuration(trip.startDate,trip.endDate);
  const totalActs=useMemo(()=>trip.itinerary.reduce((s,d)=>s+d.items.length,0),[trip.itinerary]);

  const [scrolled,setScrolled]=useState(false);
  const heroRef=useRef(null);
  const scrollRef=useRef(null);

  // IntersectionObserver: when hero sentinel scrolls out of view, show compact bar
  useEffect(()=>{
    const sentinel=heroRef.current;
    if(!sentinel) return;
    const obs=new IntersectionObserver(entries=>{
      setScrolled(!entries[0].isIntersecting);
    },{threshold:0,rootMargin:'-56px 0px 0px 0px'});
    obs.observe(sentinel);
    return()=>obs.disconnect();
  },[]);

  return(
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      {/* Sticky top bar — becomes compact when hero is scrolled away */}
      <div className={`detail-top-bar${scrolled?' scrolled':''}`}>
        <button className="back-btn" onClick={onBack}><Icon name="back"/></button>
        <div className="detail-compact-title">
          <div className="cct-main">{trip.title}</div>
          {trip.destination&&<div className="cct-sub">{trip.destination}</div>}
        </div>
        <button className="icon-btn" onClick={onPrint} title="Save PDF"><Icon name="pdf" style={{width:17,height:17}}/></button>
      </div>

      {/* Scrollable area containing hero + tabs + content */}
      <div ref={scrollRef} style={{flex:1,overflowY:'auto',overscrollBehavior:'contain',WebkitOverflowScrolling:'touch',display:'flex',flexDirection:'column',paddingBottom:'calc(var(--nav) + var(--safe-bottom) + 16px)'}}>
        {/* Hero — sentinel for IntersectionObserver */}
        <div className="detail-hero" ref={heroRef}>
          <div style={{fontFamily:"'Fraunces',serif",fontSize:26,fontWeight:700,letterSpacing:'-.025em',lineHeight:1.1,marginBottom:10,outline:'none'}}
            contentEditable suppressContentEditableWarning
            onBlur={e=>onUpdate({title:e.currentTarget.textContent.trim()||'Untitled trip'})}
            onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();e.currentTarget.blur();}}}>
            {trip.title}
          </div>
          <div className="meta-chips">
            {trip.origin&&<span className="chip"><Icon name="route"/>{trip.origin}</span>}
            <span className="chip"><Icon name="pin"/>{trip.destination||'Add destination'}</span>
            <span className="chip"><Icon name="calendar"/>{fmtDateRange(trip.startDate,trip.endDate)}{dur?` · ${dur}d`:''}</span>
            <span className="chip"><Icon name="users"/>{trip.travelers||1}</span>
            {trip.budget&&<span className="chip"><Icon name="wallet"/>{trip.currency} {Number(trip.budget).toLocaleString()}</span>}
            <span className="chip accent"><Icon name="clock"/>{totalActs} activities</span>
          </div>
        </div>

        {/* Tab bar — sticky inside the scroll container */}
        <div style={{position:'sticky',top:0,zIndex:20,background:'var(--bg)',paddingBottom:4,borderBottom:'1px solid var(--line)'}}>
          <div className="seg-tabs" style={{margin:'10px 16px 0'}}>
            {[{k:'itinerary',label:`Itinerary · ${trip.itinerary.length}d`},{k:'places',label:`Places · ${trip.places.length}`},{k:'info',label:'Trip info'}].map(t=>(
              <button key={t.k} className={`seg-tab${tab===t.k?' active':''}`} onClick={()=>onTabChange(t.k)}>{t.label}</button>
            ))}
          </div>
        </div>

        {/* Content — no longer needs its own scroll, parent handles it */}
        <div style={{flex:1,display:'flex',flexDirection:'column'}}>
        {tab==='itinerary'&&(
          <ItineraryTab
            trip={trip} searchQuery={searchQuery} onSearchChange={setSearchQuery}
            onAddDay={onAddDay} onUpdateDay={onUpdateDay} onDeleteDay={onDeleteDay}
            onAddItem={onAddItem} onUpdateItem={onUpdateItem} onDeleteItem={onDeleteItem}
            onReorderDays={onReorderDays} onReorderItems={onReorderItems}
            onShowImage={onShowImage}
          />
        )}
        {tab==='places'&&(
          <PlacesTab
            trip={trip}
            onAddPlace={onAddPlace} onUpdatePlace={onUpdatePlace} onDeletePlace={onDeletePlace}
            onShowImage={onShowImage}
          />
        )}
        {tab==='info'&&(
          <InfoTab trip={trip} onUpdate={onUpdate} onDelete={onDelete} onPrint={onPrint}/>
        )}
        </div>
      </div>{/* end outer scroll container */}
    </div>
  );
}

/* ── Itinerary Tab ── */
function ItineraryTab({trip,searchQuery,onSearchChange,onAddDay,onUpdateDay,onDeleteDay,onAddItem,onUpdateItem,onDeleteItem,onReorderDays,onReorderItems,onShowImage}){
  const [openDays,setOpenDays]=useState(()=>new Set([trip.itinerary[0]?.id].filter(Boolean)));
  const toggleDay=id=>setOpenDays(s=>{ const n=new Set(s); n.has(id)?n.delete(id):n.add(id); return n; });
  const q=(searchQuery||'').toLowerCase().trim();

  const matchedItems=useMemo(()=>{
    if(!q) return [];
    const results=[];
    trip.itinerary.forEach(day=>{ day.items.forEach(item=>{ const hay=[item.title,item.location,item.notes].join(' ').toLowerCase(); if(hay.includes(q)) results.push({day,item}); }); });
    return results;
  },[q,trip.itinerary]);

  return(
    <div style={{display:'flex',flexDirection:'column',flex:1}}>
      {/* Search */}
      <div className="search-bar" style={{margin:'12px 16px 4px',position:'sticky',top:'54px',zIndex:10,background:'var(--bg)',borderRadius:'var(--r-sm)'}}>
        <Icon name="search"/>
        <input type="text" placeholder="Search activities…" value={searchQuery} onChange={e=>onSearchChange(e.target.value)}/>
        {searchQuery&&<button style={{background:'none',border:'none',cursor:'pointer',color:'var(--muted)',display:'flex',alignItems:'center',padding:2}} onClick={()=>onSearchChange('')}><Icon name="x" style={{width:14,height:14}}/></button>}
      </div>

      <div>
        {/* Search results */}
        {q&&(
          <div style={{padding:'0 16px'}}>
            {matchedItems.length===0&&<div style={{padding:'20px 0',textAlign:'center',color:'var(--muted)',fontSize:13}}>No results for "{searchQuery}"</div>}
            {matchedItems.map(({day,item},i)=>(
              <div key={i} style={{padding:'8px 0 8px 12px',borderLeft:'2px solid var(--line)',marginBottom:6}}>
                <div style={{fontSize:10,color:'var(--muted)',marginBottom:3,textTransform:'uppercase',letterSpacing:'.08em'}}>{fmtDayHeader(day.date)}{day.label?` · ${day.label}`:''}</div>
                <div style={{fontWeight:600,fontSize:13}}><Highlight text={item.title} query={searchQuery}/></div>
                {item.location&&<div style={{fontSize:12,color:'var(--muted)',marginTop:1}}>📍 <Highlight text={item.location} query={searchQuery}/></div>}
              </div>
            ))}
          </div>
        )}

        {/* Days */}
        {!q&&(
          <>
            {trip.itinerary.length===0&&(
              <div className="empty-state" style={{padding:'40px 24px'}}>
                <Icon name="calendar"/>
                <div className="empty-title" style={{fontSize:20}}>No days yet</div>
                <div className="empty-sub">Add your first day below</div>
              </div>
            )}
            {trip.itinerary.map((day,idx)=>(
              <DayCard key={day.id} day={day} index={idx+1}
                open={openDays.has(day.id)}
                onToggle={()=>toggleDay(day.id)}
                onUpdate={patch=>onUpdateDay(day.id,patch)}
                onDelete={()=>onDeleteDay(day.id)}
                onAddItem={it=>onAddItem(day.id,it)}
                onUpdateItem={(iid,patch)=>onUpdateItem(day.id,iid,patch)}
                onDeleteItem={iid=>onDeleteItem(day.id,iid)}
                onReorderItems={(f,t)=>onReorderItems(day.id,f,t)}
                onDragOver={fromId=>onReorderDays(fromId,day.id)}
                onShowImage={onShowImage}
              />
            ))}
            {/* Add day */}
            <div className="add-day-row">
              <AddDayInline tripStart={trip.startDate} tripEnd={trip.endDate} existing={trip.itinerary.map(d=>d.date)} onAdd={onAddDay}/>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ── Day Card ── */
function DayCard({day,index,open,onToggle,onUpdate,onDelete,onAddItem,onUpdateItem,onDeleteItem,onReorderItems,onDragOver,onShowImage}){
  const [editingHead,setEditingHead]=useState(false);
  const [adding,setAdding]=useState(false);
  const [editingId,setEditingId]=useState(null);
  const [isDragOver,setIsDragOver]=useState(false);
  const dragRef=useRef(null);

  const handleDragStart=e=>{ e.dataTransfer.setData('dayId',day.id); e.dataTransfer.effectAllowed='move'; setTimeout(()=>dragRef.current?.classList.add('dragging'),0); };
  const handleDragEnd=()=>{ dragRef.current?.classList.remove('dragging'); setIsDragOver(false); };
  const handleDragOver=e=>{ e.preventDefault(); e.dataTransfer.dropEffect='move'; setIsDragOver(true); };
  const handleDragLeave=()=>setIsDragOver(false);
  const handleDrop=e=>{ e.preventDefault(); setIsDragOver(false); const fromId=e.dataTransfer.getData('dayId'); if(fromId&&fromId!==day.id) onDragOver(fromId); };

  return(
    <div ref={dragRef} className={`day-card${isDragOver?' drag-over':''}`} onDragOver={handleDragOver} onDragLeave={handleDragLeave} onDrop={handleDrop}>
      <div className="day-head">
        <div className="day-drag" draggable onDragStart={handleDragStart} onDragEnd={handleDragEnd} title="Drag to reorder" style={{cursor:'grab',display:'flex',alignItems:'center',color:'var(--muted)',opacity:.4}}>
          <Icon name="grip" style={{width:14,height:14}}/>
        </div>
        <div className="day-num">{index}</div>
        {editingHead?(
          <DayHeadEdit day={day} onSave={patch=>{onUpdate(patch);setEditingHead(false);}} onCancel={()=>setEditingHead(false)}/>
        ):(
          <div className="day-info" style={{flex:1,minWidth:0,cursor:'pointer'}} onClick={onToggle}>
            <div className="day-date">{fmtDayHeader(day.date)}</div>
            <div className="day-label">{day.label?`${day.label} · `:''}{day.items.length} activit{day.items.length===1?'y':'ies'}</div>
          </div>
        )}
        {!editingHead&&(
          <div className="day-actions">
            <button className="day-toggle" onClick={()=>setEditingHead(true)} title="Edit day"><Icon name="edit" style={{width:14,height:14}}/></button>
            <button className="day-toggle" onClick={onDelete} style={{color:'var(--danger)'}} title="Delete day"><Icon name="trash" style={{width:14,height:14}}/></button>
            <button className={`day-toggle${open?' open':''}`} onClick={onToggle}><Icon name="chev" style={{width:14,height:14}}/></button>
          </div>
        )}
      </div>

      {open&&(
        <div className="timeline">
          {day.items.length===0&&!adding&&(
            <div style={{padding:'14px 0',textAlign:'center',color:'var(--muted)',fontSize:13}}>No activities yet — add one below</div>
          )}
          {day.items.map(item=>
            editingId===item.id?(
              <ActivityEditSheet key={item.id} item={item} isNew={false}
                onSave={patch=>{onUpdateItem(item.id,patch);setEditingId(null);}}
                onCancel={()=>setEditingId(null)}/>
            ):(
              <TimelineItem key={item.id} item={item}
                onEdit={()=>setEditingId(item.id)}
                onDelete={()=>onDeleteItem(item.id)}
                onReorder={fromId=>onReorderItems(fromId,item.id)}
                onShowImage={onShowImage}
                onUpdatePhoto={img=>onUpdateItem(item.id,{...item,image:img})}
                onToggleDone={()=>onUpdateItem(item.id,{...item,done:!item.done})}/>
            )
          )}
          {adding&&(
            <ActivityEditSheet item={{time:'',duration:'',title:'',location:'',notes:'',image:''}} isNew
              onSave={patch=>{onAddItem(patch);setAdding(false);}}
              onCancel={()=>setAdding(false)}/>
          )}
          {!adding&&!editingId&&(
            <button className="btn sm" style={{marginTop:10,width:'100%',justifyContent:'center'}} onClick={()=>setAdding(true)}>
              <Icon name="plus" style={{width:13,height:13}}/> Add activity
            </button>
          )}
          <div className="day-reminder">
            <label>End-of-day reminder</label>
            <textarea className="textarea" rows="2" placeholder="e.g. Charge power bank, set alarm 6am…" value={day.notes||''} onChange={e=>onUpdate({notes:e.target.value})}/>
          </div>
        </div>
      )}
    </div>
  );
}

function DayHeadEdit({day,onSave,onCancel}){
  const [date,setDate]=useState(day.date||'');
  const [label,setLabel]=useState(day.label||'');
  return(
    <div style={{flex:1,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>

      <input className="input" style={{flex:1,minWidth:120,padding:'7px 10px',fontSize:13}} placeholder="Day label (optional)" value={label} onChange={e=>setLabel(e.target.value)}/>
      <div style={{display:'flex',gap:6}}>
        <button className="btn primary sm" onClick={()=>onSave({date,label})}><Icon name="check" style={{width:12,height:12}}/> Save</button>
        <button className="btn ghost sm" onClick={onCancel}>Cancel</button>
      </div>
    </div>
